<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stockroom</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F1F4F3;--surface:#FFFFFF;--ink:#13211D;--muted:#566762;--line:#D9E1DE;--hover:#F0F6F4;
  --accent:#0E6B5B;--accent-ink:#FFFFFF;--accent-soft:#D9EFE9;
  --good:#17703F;--good-soft:#DAF0E2;--warn:#8F5A00;--warn-soft:#FAEBC9;--crit:#B0261D;--crit-soft:#FADFDB;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1513;--surface:#161F1C;--ink:#E4EEEA;--muted:#93A59E;--line:#26332F;--hover:#1B2724;
  --accent:#3DBFA0;--accent-ink:#06211B;--accent-soft:#17352E;
  --good:#5FD08C;--good-soft:#173324;--warn:#F0B84A;--warn-soft:#3A2D10;--crit:#FF8A7E;--crit-soft:#3E1C18;color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;margin:0}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px}
.sub{color:var(--muted);font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;align-self:start;max-height:100dvh;overflow:auto;padding:20px 12px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:16px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;padding:0 8px;display:flex;align-items:baseline;gap:8px}
.brand small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:2px 6px;border-radius:4px;font-family:var(--f-body);font-weight:600}
#nav{display:flex;flex-direction:column;gap:2px}
#nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px;cursor:pointer;color:var(--muted);font-weight:500;font-size:14px}
#nav button:hover{background:var(--hover);color:var(--ink)}
#nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{font-size:11px;background:var(--bg);color:var(--muted);border-radius:10px;padding:1px 7px;font-weight:600}
#nav button[aria-current="page"] .badge{background:var(--surface);color:var(--accent)}
.who{display:flex;align-items:center;gap:8px;padding:8px;border-top:1px solid var(--line);font-size:12px;margin-top:auto;flex-wrap:wrap}
.who b{display:block;font-size:13px}
main{min-width:0;padding:20px clamp(16px,3vw,32px) 48px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.015em}
.scope{display:flex;align-items:center;gap:8px}
.scope label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.in,select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:36px;max-width:100%;width:100%}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 14px;min-height:36px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:28px;padding:3px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .in,.toolbar select{width:auto;flex:0 1 auto}
.grow{flex:1 1 220px!important;min-width:0;width:auto!important}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip b{margin-left:4px;font-weight:600}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th.num{text-align:right}
td{padding:9px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
tbody tr[data-act]{cursor:pointer}
tbody tr[data-act]:hover td{background:var(--hover)}
td.nw{white-space:nowrap}
.pn{font-weight:500}
.c-low{color:var(--warn);font-weight:600}
.c-out{color:var(--crit);font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:10px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.idle{background:var(--bg);color:var(--muted)}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line);border-top:1px solid var(--line);margin:-1px 0 0 -1px}
.kpi .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-weight:600;font-size:26px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3{font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3 span{font-weight:500;color:var(--muted);font-size:12px}
.bars{display:flex;flex-direction:column;gap:10px}
.bars li{display:grid;grid-template-columns:minmax(80px,1fr) 2fr auto;gap:10px;align-items:center}
.bt{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.bt i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bv{font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
.rows li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0;padding-top:0}
.rows .main{min-width:0;flex:1}
.rows .main div:first-child{font-weight:500}
.rows .end{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.rows li[data-act]{cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(8,16,13,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{background:var(--surface);border-radius:12px;width:100%;max-width:640px;max-height:100%;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.3);min-height:0}
.sheet.wide{max-width:860px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-family:var(--f-display);font-size:20px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.x{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:0 6px}
.sheet-b{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px;min-height:0}
.sheet-f{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.meta div span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.f input,.f select{font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink)}
.addrow{position:relative}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:5;max-height:280px;overflow:auto}
.sg{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px;cursor:pointer}
.sg:hover{background:var(--hover)}
.sg:last-child{border-bottom:0}
.sg.none{color:var(--muted);cursor:default}
input.qty{width:84px;text-align:right}
tr.err td{background:var(--crit-soft)}
.msg{color:var(--crit);font-size:13px;font-weight:500}
.tot{font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.adj{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.adj .f{flex:1 1 130px}
h4{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.callout{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13px}
.callout.warn{background:var(--warn-soft)}
#toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#setup,#login{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#setup[hidden],#login[hidden]{display:none}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:560px;display:flex;flex-direction:column;gap:16px;margin:auto}
.box .brand{font-size:26px;padding:0}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px}
.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.step .b{flex:1;display:flex;flex-direction:column;gap:8px}
.step .b b{font-size:13px}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px 8px;gap:8px}
  #nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  #nav button{width:auto;white-space:nowrap}
  .who{display:none}
}
</style>
</head>
<body>

<div class="app" id="app" hidden>
  <aside class="rail">
    <div class="brand">Stockroom<small id="modeTag">Local</small></div>
    <nav id="nav"></nav>
    <div class="who" id="who"></div>
  </aside>
  <main>
    <header class="top">
      <h1 id="viewTitle">Overview</h1>
      <div class="scope"><label for="branchSel">Branch</label><select id="branchSel" style="width:auto"></select></div>
    </header>
    <section id="view"></section>
  </main>
</div>

<div id="overlay" class="overlay" hidden><div id="sheetHost" style="display:contents"></div></div>
<div id="setup" hidden></div>
<div id="login" hidden></div>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ---------- CONFIG ---------- */
var CFG_KEY='stockroom.cfg';
var DB_KEY='stockroom.local.db';
function getCfg(){try{return JSON.parse(localStorage.getItem(CFG_KEY)||'null')}catch(e){return null}}
function setCfg(c){localStorage.setItem(CFG_KEY,JSON.stringify(c))}
function clearCfg(){localStorage.removeItem(CFG_KEY)}
var db=null, LIVE=false;

/* ---------- Small utilities (defined first, used everywhere) ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function pad(n,l){return String(n).padStart(l,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function addM(s,n){var p=s.split('-').map(Number);var dim=new Date(p[0],p[1]-1+n+1,0).getDate();return iso(new Date(p[0],p[1]-1+n,Math.min(p[2],dim),12))}
function cEnd(s,m){return iso(addDays(new Date(addM(s,m)+'T12:00:00'),-1))}
function dshort(s){if(!s)return '—';var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function dayDiff(a,b){return Math.round((Date.parse(b)-Date.parse(a))/864e5)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return '৳'+Math.round(n||0).toLocaleString('en-IN')}
function num(n){return Math.round(n||0).toLocaleString('en-IN')}
function qf(p,q){return p.unit?(+(+q).toFixed(2)).toLocaleString('en-IN'):num(q)}
function nowT(){var d=new Date();return pad(d.getHours(),2)+':'+pad(d.getMinutes(),2)}
function bname(id){var b=BRANCHES.find(function(x){return x.id===id});return b?b.name:id}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show')},3400)}

/* ---------- Static reference data ---------- */
var BRANCHES=[
  {id:'DHK',name:'Dhaka Hub',scale:2.2},
  {id:'CTG',name:'Chattogram',scale:1.3},
  {id:'RAJ',name:'Rajshahi',scale:1.0},
  {id:'KHL',name:'Khulna',scale:0.9}
];
var CATS=[
  {code:'DEV',name:'Diffuser devices'},{code:'OIL',name:'Fragrance oils'},
  {code:'BLK',name:'Bulk oil (kg)'},{code:'RDS',name:'Room scents'},
  {code:'PKG',name:'Packaging'},{code:'DAI',name:'Dairy'},
  {code:'BEV',name:'Beverages'},{code:'HHD',name:'Household'}
];
var CATBY={};CATS.forEach(function(c){CATBY[c.code]=c});
var SCENTS=['Oud Royale','White Musk','Amber Wood','Jasmine Night','Sandalwood','Rose Garden','Citrus Fresh','Ocean Breeze'];
var DENSITY={};SCENTS.forEach(function(s){DENSITY[s]=0.92});
var CTYPES=['Hotel or resort','Office','Clinic','Spa or salon','Restaurant or cafe','Retail or showroom','Reseller'];
var RCATS=['Small room','Medium room','Large space','HVAC duct'];
var RITEMS=[
  {id:'r0',code:'FLT-001',name:'Aeroscent Mini',cat:'Small room',fee:1200,deposit:3000,value:7500,oil_ml:60,coverage:'30 m²'},
  {id:'r1',code:'FLT-002',name:'Aeroscent Pro',cat:'Medium room',fee:2800,deposit:8000,value:18000,oil_ml:150,coverage:'100 m²'},
  {id:'r2',code:'FLT-003',name:'Mistral Wall 500',cat:'Large space',fee:5000,deposit:15000,value:35000,oil_ml:300,coverage:'200 m²'},
  {id:'r3',code:'FLT-004',name:'Mistral Tower 800',cat:'Large space',fee:6500,deposit:20000,value:48000,oil_ml:400,coverage:'300 m²'},
  {id:'r4',code:'FLT-005',name:'HVAC Duct 1000',cat:'HVAC duct',fee:12000,deposit:40000,value:90000,oil_ml:800,coverage:'1,000 m²'}
];
var RBY={};RITEMS.forEach(function(r){RBY[r.id]=r});
var SUPS=[
  {id:'S1',name:'Green Valley Dairy Farms',cats:['DAI']},
  {id:'S2',name:'Delta Beverage Traders',cats:['BEV']},
  {id:'S8',name:'Aeroscent Devices Factory',cats:['DEV']},
  {id:'S9',name:'Oud & Essence Co.',cats:['OIL','BLK']},
  {id:'S11',name:'Aroma House Home Scents',cats:['RDS']},
  {id:'S12',name:'Glasspack Industries',cats:['PKG']},
  {id:'S13',name:'Metro Wholesale Depot',cats:CATS.map(function(c){return c.code})}
];
var SUPBY={};SUPS.forEach(function(s){SUPBY[s.id]=s});

/* ---------- Runtime state ---------- */
var PRODUCTS=[],ORDERS=[],CONTRACTS=[],CUSTOMERS=[],POS=[],TRANSFERS=[],FLEET=[];
var byId={};
var session=null;
var SETTINGS={vatRate:0,vatInclusive:false,approvalThreshold:100000,min:{}};
var counters={so:24180,po:3040,tr:7010,rc:4100};
var today=new Date();today.setHours(12,0,0,0);
var TODAY_ISO=iso(today);
var state={view:'overview',branch:'all',
  inv:{q:'',cat:'all',st:'all',page:0},ord:{st:'All',q:'',page:0},
  ct:{st:'All',q:''},rf:{st:'Pending',q:''},cust:{q:''},fl:{q:'',cat:'all'}};

/* ---------- Domain helpers ---------- */
function minFor(p,b){var o=SETTINGS.min[p.id];if(o&&o[b]!=null)return o[b];var br=BRANCHES.find(function(x){return x.id===b})||{scale:1};return Math.ceil((p.rl||0)*br.scale)}
function kgOf(ml,sc){return ml*(DENSITY[sc]||0.92)/1000}
function bulkProd(sc){return PRODUCTS.find(function(p){return p.cat==='BLK'&&p.scent===sc})}
function custByName(n){return CUSTOMERS.find(function(c){return c.name===n})}
function orderSub(o){return (o.lines||[]).reduce(function(s,l){return s+l.qty*l.price},0)}
function orderTotal(o){return Math.max(0,orderSub(o)-(o.discount||0))}
function cMonthly(c){return (c.lines||[]).reduce(function(s,l){return s+l.qty*l.fee},0)}
function cUnits(c){return (c.lines||[]).reduce(function(s,l){return s+l.qty},0)}
function cstat(c){if(c.status==='Ended'||c.status==='Reserved')return c.status;var e=c.end_date;if(e<TODAY_ISO)return 'Expired';if(dayDiff(TODAY_ISO,e)<=30)return 'Ending soon';return 'Active'}
function rfstat(r){if(r.status!=='Scheduled')return r.status;if(r.due<TODAY_ISO)return 'Overdue';if(r.due===TODAY_ISO)return 'Due today';return 'Scheduled'}
var ORD_FLOW={'New':['Packed','Mark packed'],'Packed':['Out for delivery','Dispatch'],'Out for delivery':['Delivered','Deliver']};
function pillFor(s){return {'New':'idle','Packed':'info','Out for delivery':'warn','Delivered':'good','Ordered':'warn','Received':'good','Completed':'good','Pending approval':'warn','Approved':'good','Rejected':'crit','Active':'good','Ending soon':'warn','Expired':'crit','Ended':'idle','Reserved':'info'}[s]||'idle'}
function pill(t,c){return '<span class="pill '+(c||pillFor(t))+'">'+esc(t)+'</span>'}
var STAT=[['OK','good'],['Low','warn'],['Out','crit']];
function table(head,rows){return '<div class="tablewrap"><table><thead><tr>'+head+'</tr></thead><tbody>'+rows+'</tbody></table></div>'}
function barList(items,fmt){var max=Math.max.apply(null,items.map(function(i){return i.v}).concat([1]));
  return '<ul class="bars">'+items.map(function(i){return '<li><span>'+esc(i.l)+'</span><span class="bt"><i style="width:'+(i.v/max*100).toFixed(1)+'%"></i></span><span class="bv">'+fmt(i.v)+'</span></li>'}).join('')+'</ul>'}
function pstat(p){var w=0;BRANCHES.forEach(function(b){var q=(p.stock||{})[b.id]||0,m=minFor(p,b.id);var s=q<=0?2:q<=m?1:0;if(s>w)w=s});return w}
function fOutNow(it,b){var n=0;CONTRACTS.forEach(function(c){if(c.status==='Active'&&c.branch===b)(c.lines||[]).forEach(function(l){if(l.rid===it.id)n+=l.qty})});return n}
function scopeBranches(){return state.branch==='all'?BRANCHES:BRANCHES.filter(function(b){return b.id===state.branch})}
function inScope(x){return state.branch==='all'||x.branch===state.branch||x.from_branch===state.branch||x.to_branch===state.branch}
function alerts(){var out=[];PRODUCTS.forEach(function(p){scopeBranches().forEach(function(b){var q=(p.stock||{})[b.id]||0,m=minFor(p,b.id);if(q<=m)out.push({p:p,b:b.id,q:q,m:m})})});
  return out.sort(function(a,b){return ((a.q===0?0:1)-(b.q===0?0:1))||(a.q/a.m-b.q/b.m)})}

/* ---------- Storage ---------- */
function stripLocal(o){var x=Object.assign({},o);delete x.id;return x}
function snapshot(){return{products:PRODUCTS,orders:ORDERS,contracts:CONTRACTS,customers:CUSTOMERS,pos:POS,transfers:TRANSFERS,fleet:FLEET,settings:SETTINGS,counters:counters}}
function applySnapshot(d){
  PRODUCTS.length=0;ORDERS.length=0;CONTRACTS.length=0;CUSTOMERS.length=0;POS.length=0;TRANSFERS.length=0;FLEET.length=0;
  Object.keys(byId).forEach(function(k){delete byId[k]});
  (d.products||[]).forEach(function(x){PRODUCTS.push(x);byId[x.id]=x});
  (d.orders||[]).forEach(function(x){ORDERS.push(x)});
  (d.contracts||[]).forEach(function(x){CONTRACTS.push(x)});
  (d.customers||[]).forEach(function(x){CUSTOMERS.push(x)});
  (d.pos||[]).forEach(function(x){POS.push(x)});
  (d.transfers||[]).forEach(function(x){TRANSFERS.push(x)});
  (d.fleet||[]).forEach(function(x){FLEET.push(x)});
  if(d.settings)SETTINGS=Object.assign(SETTINGS,d.settings);
  if(d.counters)counters=Object.assign(counters,d.counters);
}
var Store={
  load:async function(){
    if(LIVE){
      var r=await Promise.all([
        db.from('products').select('*'),
        db.from('orders').select('*').order('date',{ascending:false}),
        db.from('contracts').select('*'),
        db.from('customers').select('*'),
        db.from('pos').select('*'),
        db.from('transfers').select('*'),
        db.from('fleet').select('*'),
        db.from('settings').select('*')
      ]);
      PRODUCTS.length=0;ORDERS.length=0;CONTRACTS.length=0;CUSTOMERS.length=0;
      POS.length=0;TRANSFERS.length=0;FLEET.length=0;
      Object.keys(byId).forEach(function(k){delete byId[k]});
      (r[0].data||[]).forEach(function(x){PRODUCTS.push(x);byId[x.id]=x});
      (r[1].data||[]).forEach(function(x){ORDERS.push(x)});
      (r[2].data||[]).forEach(function(x){CONTRACTS.push(x)});
      (r[3].data||[]).forEach(function(x){CUSTOMERS.push(x)});
      (r[4].data||[]).forEach(function(x){POS.push(x)});
      (r[5].data||[]).forEach(function(x){TRANSFERS.push(x)});
      (r[6].data||[]).forEach(function(x){FLEET.push(x)});
      var s={};(r[7].data||[]).forEach(function(x){s[x.key]=x.value});
      SETTINGS=Object.assign({vatRate:0,vatInclusive:false,approvalThreshold:100000,min:{}},s);
      if(!SETTINGS.min)SETTINGS.min={};
      if(s.counters)counters=Object.assign(counters,s.counters);
    }else{
      var raw=localStorage.getItem(DB_KEY);
      if(raw){try{applySnapshot(JSON.parse(raw))}catch(e){console.warn('bad local save')}}
    }
  },
  save:async function(){
    if(LIVE)return;
    try{localStorage.setItem(DB_KEY,JSON.stringify(snapshot()))}catch(e){console.warn(e)}
  },
  insertProduct:async function(p){PRODUCTS.push(p);byId[p.id]=p;if(LIVE)await db.from('products').insert([stripLocal(p)]);else await Store.save()},
  updateProduct:async function(p){if(LIVE)await db.from('products').update({stock:p.stock,name:p.name,price:p.price,cost:p.cost,rl:p.rl}).eq('id',p.id);else await Store.save()},
  insertOrder:async function(o){ORDERS.unshift(o);if(LIVE){var r=await db.from('orders').insert([stripLocal(o)]).select().single();if(r.data)o.id=r.data.id}else await Store.save()},
  updateOrder:async function(o){if(LIVE)await db.from('orders').update({status:o.status,paid:o.paid}).eq('id',o.id);else await Store.save()},
  insertCustomer:async function(c){CUSTOMERS.push(c);if(LIVE){var r=await db.from('customers').insert([stripLocal(c)]).select().single();if(r.data)c.id=r.data.id}else await Store.save()},
  updateCustomer:async function(c){if(LIVE)await db.from('customers').update({credit:c.credit||0,limit_:c.limit_||50000}).eq('id',c.id);else await Store.save()},
  insertContract:async function(c){CONTRACTS.push(c);if(LIVE){var r=await db.from('contracts').insert([stripLocal(c)]).select().single();if(r.data)c.id=r.data.id}else await Store.save()},
  updateContract:async function(c){if(LIVE)await db.from('contracts').update({status:c.status,ended_on:c.ended_on||null,damage:c.damage||0,lines:c.lines,refills:c.refills}).eq('id',c.id);else await Store.save()},
  insertPO:async function(p){POS.unshift(p);if(LIVE){var r=await db.from('pos').insert([stripLocal(p)]).select().single();if(r.data)p.id=r.data.id}else await Store.save()},
  updatePO:async function(p){if(LIVE)await db.from('pos').update({status:p.status,approval:p.approval,approved_by:p.approved_by||null,receipt_no:p.receipt_no||null}).eq('id',p.id);else await Store.save()},
  insertTransfer:async function(t){TRANSFERS.unshift(t);if(LIVE){var r=await db.from('transfers').insert([stripLocal(t)]).select().single();if(r.data)t.id=r.data.id}else await Store.save()},
  saveSettings:async function(){
    if(LIVE)await db.from('settings').upsert([
      {key:'vatRate',value:SETTINGS.vatRate},
      {key:'approvalThreshold',value:SETTINGS.approvalThreshold},
      {key:'min',value:SETTINGS.min||{}},
      {key:'counters',value:counters}
    ]);
    else await Store.save();
  }
};

/* ---------- Sample data ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
async function seedIfEmpty(){
  if(!LIVE){
    if(localStorage.getItem(DB_KEY))return false;
  }else{
    var c=await db.from('products').select('id',{count:'exact',head:true});
    if(c.count&&c.count>0)return false;
  }
  var rnd=mulberry32(20261010);
  function ri(a,b){return a+Math.floor(rnd()*(b-a+1))}
  function pk(a){return a[Math.floor(rnd()*a.length)]}

  var items=[
    ['DEV','Nebula Mini Diffuser',[['White',7500],['Black',7500]]],
    ['DEV','Nebula Pro Diffuser',[['White',18000],['Black',18000]]],
    ['DEV','Mistral Wall 500',[['Standard',35000]]],

    ['DEV','HVAC Duct 1000',[['Standard',90000]]],
    ['OIL','Oud Royale Fragrance Oil',[['100 ml',1200],['500 ml',5500],['1 L',10000]]],
    ['OIL','White Musk Fragrance Oil',[['100 ml',1200],['500 ml',5500]]],
    ['OIL','Amber Wood Fragrance Oil',[['100 ml',1300],['500 ml',5800]]],
    ['OIL','Jasmine Night Fragrance Oil',[['100 ml',1400],['500 ml',6200]]],
    ['BLK','Oud Royale Bulk Oil',[['per kg',7500]]],
    ['BLK','White Musk Bulk Oil',[['per kg',7000]]],
    ['BLK','Amber Wood Bulk Oil',[['per kg',7200]]],
    ['BLK','Jasmine Night Bulk Oil',[['per kg',7600]]],
    ['RDS','Reed Diffuser Set',[['100 ml',1400],['200 ml',2300]]],
    ['RDS','Room Spray',[['250 ml',650],['500 ml',1100]]],
    ['RDS','Scented Candle',[['Small',500],['Large',1200]]],
    ['PKG','Empty Glass Bottle',[['100 ml',110],['500 ml',210]]],
    ['PKG','Gift Box',[['Small',90],['Large',160]]],
    ['DAI','Fresh Milk',[['1 L',92],['2 L',178]]],
    ['DAI','Butter',[['100 g',110],['500 g',480]]],
    ['DAI','Set Yogurt',[['500 g',118],['1 kg',215]]],
    ['BEV','Drinking Water',[['1 L',28],['2 L',45]]],
    ['BEV','Cola',[['600 ml',45],['2 L',95]]],
    ['BEV','Orange Juice',[['1 L',125]]],
    ['HHD','Dishwash Liquid',[['250 ml',70],['750 ml',190]]],
    ['HHD','Laundry Powder',[['1 kg',170],['3 kg',480]]]
  ];
  var n=0;
  items.forEach(function(row){
    var cat=row[0],itemName=row[1],sizes=row[2];
    sizes.forEach(function(sz){
      var size=sz[0],price=sz[1];
      var code=cat+'-'+pad(++n,4);
      var rl=cat==='DEV'?ri(2,8):cat==='BLK'?ri(4,14):ri(6,28);
      var stock={};
      BRANCHES.forEach(function(b){stock[b.id]=Math.round(rl*b.scale*(0.8+rnd()*5))});
      var scent=(cat==='OIL'||cat==='BLK')?itemName.split(' ').slice(0,2).join(' '):null;
      var p={id:'p'+n,sku:code,name:itemName+' '+size,cat:cat,brand:'Sample',item:itemName,size:size,
        price:price,cost:Math.round(price*0.6),rl:rl,stock:stock,
        supplier:(SUPS.find(function(s){return s.cats.includes(cat)})||SUPS[0]).id,
        scent:scent,ml:cat==='OIL'?(parseInt(size,10)||1000):null,unit:cat==='BLK'?'kg':null};
      p.hay=(p.name+' '+p.sku+' '+p.brand+' '+cat).toLowerCase();
      PRODUCTS.push(p);byId[p.id]=p;
    });
  });

  var custNames=[
    ['Lakeview Hotel, Gulshan','DHK'],['Blue Orchid Spa, Dhanmondi','DHK'],
    ['Nexus Office Tower, Motijheel','DHK'],['Sapphire Showroom, Banani','DHK'],
    ['Port City Hotel, Agrabad','CTG'],['Seaview Restaurant, Nasirabad','CTG'],
    ['Silk City Hotel','RAJ'],['Padma Salon, Shaheb Bazar','RAJ'],
    ['Rupsha Riverside Hotel','KHL'],['Sonadanga Showroom','KHL']
  ];
  custNames.forEach(function(row,i){
    var name=row[0],br=row[1];
    CUSTOMERS.push({id:'C'+pad(1001+i,4),name:name,branch:br,
      type:/Hotel|Resort/.test(name)?'Hotel or resort':/Spa|Salon/.test(name)?'Spa or salon':/Office/.test(name)?'Office':/Restaurant/.test(name)?'Restaurant or cafe':'Retail or showroom',
      contact:'Sample Contact',phone:'01700-000'+pad(100+i,3),
      address:br,since:TODAY_ISO,limit_:100000,credit:0});
  });

  RITEMS.forEach(function(it){
    var own={};BRANCHES.forEach(function(b){own[b.id]=Math.max(2,Math.round(10*b.scale))});
    FLEET.push(Object.assign({},it,{own:own}));
  });

  var soNo=24180;
  for(var d=13;d>=0;d--){
    var date=iso(addDays(today,-d));
    var count=ri(3,7)-(d===0?2:0);
    for(var k=0;k<count;k++){
      var b=BRANCHES[Math.floor(rnd()*BRANCHES.length)];
      var lines=[];var used={};var nl=ri(2,4);
      while(lines.length<nl){
        var p=pk(PRODUCTS);
        if(used[p.id]||p.cat==='BLK')continue;
        used[p.id]=1;
        lines.push({pid:p.id,qty:ri(1,4),price:p.price});
      }
      var pool=custNames.filter(function(c){return c[1]===b.id});
      var cust=pool.length?pk(pool)[0]:custNames[0][0];
      ORDERS.unshift({id:ORDERS.length+1,order_no:'SO-'+(++soNo),date:date,
        time:pad(ri(7,17),2)+':'+pad(ri(0,59),2),
        branch:b.id,customer:cust,lines:lines,discount:0,
        status:d===0?'New':'Delivered',paid:rnd()<0.7});
    }
  }

  if(LIVE){
    await db.from('products').insert(PRODUCTS.map(stripLocal));
    await db.from('customers').insert(CUSTOMERS.map(stripLocal));
    await db.from('fleet').insert(FLEET.map(stripLocal));
    if(ORDERS.length)await db.from('orders').insert(ORDERS.map(stripLocal));
    await db.from('settings').upsert([
      {key:'vatRate',value:0},{key:'approvalThreshold',value:100000},
      {key:'min',value:{}},{key:'counters',value:{so:soNo,po:3040,tr:7010,rc:4100}}
    ]);
  }else{
    var rcNo=4100;
    for(var i=0;i<6;i++){
      var b2=BRANCHES[i%BRANCHES.length];
      var it=pk(RITEMS);var months=12;var start=iso(addDays(today,-ri(10,120)));
      var end=cEnd(start,months);var sc=pk(SCENTS);
      var bk=PRODUCTS.find(function(p){return p.cat==='BLK'&&p.scent===sc});
      var qty=1;var ml=qty*it.oil_ml;
      var refills=[];
      for(var n2=1;n2<=months;n2++){var dd=addM(start,n2-1);if(dd>end)break;refills.push({n:n2,due:dd,status:n2<=3?'Delivered':'Scheduled',ml:ml,deliveredOn:n2<=3?dd:null})}
      var pool2=custNames.filter(function(c){return c[1]===b2.id});
      CONTRACTS.push({id:CONTRACTS.length+1,contract_no:'RC-'+(++rcNo),
        customer:pool2.length?pk(pool2)[0]:custNames[0][0],branch:b2.id,
        start_date:start,months:months,every_:1,end_date:end,status:'Active',
        lines:[{rid:it.id,qty:qty,fee:it.fee,lost:0}],
        oil:bk?{pid:bk.id,scent:sc,ml:ml}:null,refills:refills,deposit:it.deposit,damage:0});
    }
    for(var i2=0;i2<5;i2++){
      var sup=pk(SUPS);var b3=pk(BRANCHES);
      var pool3=PRODUCTS.filter(function(p){return sup.cats.includes(p.cat)});
      var lines3=pool3.slice(0,3).map(function(p){return {pid:p.id,qty:Math.max(12,p.rl*2),price:p.cost}});
      var received=i2<3;
      POS.push({id:POS.length+1,po_no:'PO-'+(++counters.po),date:iso(addDays(today,-ri(5,20))),
        expected:iso(addDays(today,received?-3:ri(1,4))),supplier:sup.id,branch:b3.id,lines:lines3,
        status:received?'Received':'Ordered',approval:'Approved',receipt_no:received?'GRN-'+(++counters.rc):null});
      if(received)lines3.forEach(function(l){var p=byId[l.pid];if(p)p.stock[b3.id]=(p.stock[b3.id]||0)+l.qty});
    }
    for(var i3=0;i3<3;i3++){
      var from=BRANCHES[0].id,to=BRANCHES[1].id;
      var lines4=PRODUCTS.slice(i3*2,i3*2+2).map(function(p){return {pid:p.id,qty:2,price:p.price}});
      TRANSFERS.push({id:TRANSFERS.length+1,tr_no:'TR-'+(++counters.tr),date:iso(addDays(today,-ri(1,10))),
        from_branch:from,to_branch:to,lines:lines4,status:'Completed'});
    }
    await Store.save();
  }
  return true;
}

async function connectLive(){
  var url=$('#s_url').value.trim();
  var key=$('#s_key').value.trim();
  if(!url||!key)return $('#s_err').textContent='Both fields are required.';
  if(!/^https?:\/\//.test(url))return $('#s_err').textContent='The URL should start with https://';
  if(!window.supabase)return $('#s_err').textContent='Could not load Supabase library. Check your internet connection.';
  $('#s_err').textContent='Connecting…';
  try{
    var test=window.supabase.createClient(url,key);
    var r=await test.from('products').select('id',{head:true,count:'exact'}).limit(1);
    if(r.error)throw r.error;
    setCfg({url:url,key:key});
    db=test;LIVE=true;
    $('#setup').hidden=true;
    await startSession();
  }catch(e){
    $('#s_err').textContent='Could not connect: '+(e.message||e);
  }
}
function useLocal(){
  setCfg({local:true});
  LIVE=false;db=null;
  $('#setup').hidden=true;
  session={id:'local',name:'Local Demo',role:'owner',branches:'all',email:'local@demo'};
  bootApp();
}

/* ---------- Auth ---------- */
async function startSession(){
  if(!LIVE)return;
  var r=await db.auth.getSession();
  if(r.data.session){
    session={id:r.data.session.user.id,email:r.data.session.user.email,
      name:r.data.session.user.email.split('@')[0],role:'owner',branches:'all'};
    return bootApp();
  }
  renderLogin();
}
function renderLogin(){
  $('#app').hidden=true;
  var box=$('#login');box.hidden=false;
  box.innerHTML='<div class="box">'+
    '<div class="brand">Stockroom<small>Live</small></div>'+
    '<p class="sub">Sign in. If this is your first time, create an account below — you will be the owner.</p>'+

    '<label class="f">Password<input id="l_pass" class="in" type="password" autocomplete="current-password"></label>'+
    '<div id="l_err" class="msg"></div>'+
    '<button class="btn primary" data-act="sign-in">Sign in</button>'+
    '<button class="btn" data-act="sign-up">Create account</button>'+
    '<button class="btn ghost small" data-act="reconfigure" style="align-self:flex-start">Change Supabase project</button>'+
  '</div>';
  setTimeout(function(){$('#l_email').focus()},50);
}
async function doSignIn(){
  var email=$('#l_email').value.trim();
  var password=$('#l_pass').value;
  if(!email||!password)return $('#l_err').textContent='Email and password required.';
  $('#l_err').textContent='Signing in…';
  var r=await db.auth.signInWithPassword({email:email,password:password});
  if(r.error)return $('#l_err').textContent=r.error.message;
  session={id:r.data.user.id,email:r.data.user.email,name:email.split('@')[0],role:'owner',branches:'all'};
  $('#login').hidden=true;
  bootApp();
}
async function doSignUp(){
  var email=$('#l_email').value.trim();
  var password=$('#l_pass').value;
  if(!email||!password)return $('#l_err').textContent='Email and password required.';
  if(password.length<6)return $('#l_err').textContent='Password must be at least 6 characters.';
  $('#l_err').textContent='Creating account…';
  var r=await db.auth.signUp({email:email,password:password});
  if(r.error)return $('#l_err').textContent=r.error.message;
  if(!r.data.session){
    return $('#l_err').textContent='Account created. Check your email to confirm, then sign in. (You can turn off email confirmation in Supabase → Authentication → Providers → Email.)';
  }
  session={id:r.data.user.id,email:r.data.user.email,name:email.split('@')[0],role:'owner',branches:'all'};
  $('#login').hidden=true;
  bootApp();
}
async function signOut(){
  if(LIVE&&db)await db.auth.signOut();
  session=null;
  PRODUCTS.length=0;ORDERS.length=0;CONTRACTS.length=0;CUSTOMERS.length=0;
  POS.length=0;TRANSFERS.length=0;FLEET.length=0;Object.keys(byId).forEach(function(k){delete byId[k]});
  closeModal();
  if(LIVE)renderLogin();else{clearCfg();location.reload()}
}

/* ---------- Boot ---------- */
async function bootApp(){
  try{await seedIfEmpty()}catch(e){console.warn('seed',e)}
  try{await Store.load()}catch(e){console.warn('load',e);toast('Could not load data: '+e.message)}
  $('#login').hidden=true;$('#app').hidden=false;
  $('#modeTag').textContent=LIVE?'Live':'Local';
  $('#nav').innerHTML=Object.keys(TITLES).map(function(k){
    return '<button type="button" data-act="nav" data-view="'+k+'">'+TITLES[k]+'<span class="badge" id="bd-'+k+'" hidden></span></button>'
  }).join('');
  $('#branchSel').innerHTML='<option value="all">All branches</option>'+BRANCHES.map(function(b){return '<option value="'+b.id+'">'+esc(b.name)+'</option>'}).join('');
  renderWho();
  render(true);
  if(LIVE){
    db.channel('sr')
      .on('postgres_changes',{event:'*',schema:'public',table:'products'},function(){Store.load().then(function(){render()})})
      .on('postgres_changes',{event:'*',schema:'public',table:'orders'},function(){Store.load().then(function(){render()})})
      .on('postgres_changes',{event:'*',schema:'public',table:'contracts'},function(){Store.load().then(function(){render()})})
      .subscribe();
  }
}

function custStats(c){
  var n=0,total=0,due=0,last='';
  ORDERS.forEach(function(o){if(o.customer!==c.name)return;n++;total+=orderTotal(o);if(!o.paid)due+=orderTotal(o);if(o.date>last)last=o.date});
  return{n:n,total:total,due:due,last:last};
}

async function deliverRefill(no,n,fromModal){
  var c=CONTRACTS.find(function(x){return x.contract_no===no});if(!c||!c.oil)return;
  var r=(c.refills||[]).find(function(x){return x.n===n});if(!r||r.status!=='Scheduled')return;
  var p=byId[c.oil.pid];if(!p)return;
  var kg=+kgOf(r.ml,c.oil.scent).toFixed(3);
  var cur=(p.stock||{})[c.branch]||0;
  if(cur<kg)return toast('Need '+kg+' kg of '+c.oil.scent+', have '+cur+' kg.');
  p.stock=Object.assign({},p.stock,{[c.branch]:+(cur-kg).toFixed(3)});
  await Store.updateProduct(p);
  r.status='Delivered';r.deliveredOn=TODAY_ISO;
  await Store.updateContract(c);
  if(fromModal)openContract(no);render();toast('Refill '+n+' delivered.');
}

function refreshDoc(){
  var d=draft,t=d.type;var total=0,bad=false,over=false;
  d.lines.forEach(function(l,i){var p=byId[l.pid];var row=$('#docLines tr[data-i="'+i+'"]');
    var err=!(l.qty>0)||(t!=='po'&&l.qty>((p.stock||{})[d.branch]||0));
    if(t!=='po'&&l.qty>((p.stock||{})[d.branch]||0))over=true;
    if(row){row.classList.toggle('err',err);var a=row.querySelector('[data-amt]');if(a)a.textContent=money(l.qty*l.price)}
    if(err)bad=true;total+=Math.max(0,l.qty)*(l.price||0)});
  if(t==='order')total=Math.max(0,total-(+d.discount||0));
  if($('#docSum'))$('#docSum').textContent=money(total);
  if($('#docMsg'))$('#docMsg').textContent=over?'Not enough stock.':'';
  var miss=!d.lines.length||(t==='order'&&!d.party.trim())||(t==='transfer'&&d.branch===d.to);
  if($('#docSave'))$('#docSave').disabled=bad||miss;

      type:'Retail or showroom',contact:'',phone:'',address:'—',since:TODAY_ISO,limit_:50000,credit:0})}
    var o={order_no:'SO-'+(++counters.so),date:TODAY_ISO,time:nowT(),branch:d.branch,customer:d.party.trim(),
      lines:d.lines.map(function(l){return Object.assign({},l)}),discount:+d.discount||0,status:'New',paid:false};
    for(var i=0;i<o.lines.length;i++){
      var l=o.lines[i];var p=byId[l.pid];
      p.stock=Object.assign({},p.stock,{[d.branch]:((p.stock||{})[d.branch]||0)-l.qty});

      lines:d.lines.map(function(l){return Object.assign({},l)}),status:'Ordered',approval:'Approved'};

      lines:d.lines.map(function(l){return Object.assign({},l)}),status:'Completed'};
    for(var j=0;j<tr.lines.length;j++){

}

    }

    case 'po-recv':receivePO(D.no);break;

    case 'doc-add':{
      var p2=byId[D.pid];var ex=draft.lines.find(function(l){return l.pid===p2.id});
      if(ex)ex.qty+=1;else draft.lines.push({pid:p2.id,qty:draft.type==='po'?Math.max(12,p2.rl*2):1,price:draft.type==='po'?p2.cost:p2.price});
      if($('#d_search'))$('#d_search').value='';if($('#d_sugg'))$('#d_sugg').hidden=true;renderLines();break;
    }
    case 'doc-rm':draft.lines.splice(+D.i,1);renderLines();break;
    case 'doc-save':saveDoc();break;
    case 'cust-open':openCustomer(D.id);break;
    case 'new-cust':openNewCustomer();break;
    case 'cust-save':saveCustomer();break;
    case 'cust-collect':collectCustomer(D.id);break;
    case 'cust-order':openDoc('order',{branch:D.b,party:D.name});break;

    case 'fl-open':openFleetItem(D.id);break;
    case 'fleet-contract':openContractDoc({branch:(state.branch==='all'?'DHK':state.branch),lines:[{rid:D.id,qty:1,fee:RBY[D.id].fee}]});break;
    case 'k-add':{
      var it=RBY[D.id];var ex2=kd.lines.find(function(l){return l.rid===it.id});
      if(ex2)ex2.qty+=1;else kd.lines.push({rid:it.id,qty:1,fee:it.fee});
      if($('#k_search'))$('#k_search').value='';if($('#k_sugg'))$('#k_sugg').hidden=true;renderContractLines();break;

    case 'k-save':saveContract();break;

document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='invCat'){state.inv.cat=t.value;state.inv.page=0;updateInv();return}
  if(t.id==='invSt'){state.inv.st=t.value;state.inv.page=0;updateInv();return}
  if(t.id==='flCat'){state.fl.cat=t.value;vFleet();return}
  if(t.id==='branchSel'){state.branch=t.value;state.inv.page=0;state.ord.page=0;render();return}
  if(t.id==='d_branch'){
    draft.branch=t.value;
    if(draft.to===draft.branch)draft.to=(BRANCHES.find(function(b){return b.id!==draft.branch})||BRANCHES[1]).id;
    if(draft.type==='order'&&!CUSTOMERS.some(function(c){return c.name===draft.party&&c.branch===draft.branch})){
      var first=CUSTOMERS.find(function(c){return c.branch===draft.branch});
      if(first)draft.party=first.name;
    }
    renderDoc();return;
  }
  if(t.id==='d_to'){draft.to=t.value;refreshDoc();return}
  if(t.id==='d_sup'){
    draft.supplier=t.value;
    var cats=SUPBY[t.value].cats;
    draft.lines=draft.lines.filter(function(l){return cats.includes(byId[l.pid].cat)});
    renderDoc();return;
  }
  if(t.id==='k_branch'){
    kd.branch=t.value;
    var first2=CUSTOMERS.find(function(c){return c.branch===kd.branch});
    if(first2)kd.party=first2.name;
    renderContractDoc();return;
  }
  if(t.id==='k_term'){kd.term=+t.value;renderContractLines();return}
  if(t.id==='k_oil'){kd.oil=t.value;renderContractDoc();return}
  if(t.id==='k_scent'){kd.scent=t.value;refreshContract();return}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#overlay').hidden){closeModal();return}
  if(e.key==='Enter'&&e.target.id==='l_pin')doSignIn();
  if(e.key==='Enter'&&e.target.id==='l_pass'&&!$('#login').hidden){
    if($('#login').innerHTML.indexOf('Create account')>-1)doSignUp();
  }
});

/* ---------- Entry point ---------- */
async function boot(){
  var cfg=getCfg();
  if(!cfg){renderSetup();return}
  if(cfg.local){
    LIVE=false;db=null;
    session={id:'local',name:'Local Demo',role:'owner',branches:'all',email:'local@demo'};
    await bootApp();return;
  }
  if(!window.supabase){renderSetup();return}
  db=window.supabase.createClient(cfg.url,cfg.key);
  LIVE=true;
  await startSession();
}
boot();
</script>
