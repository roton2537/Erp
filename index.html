<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stockroom</title>
<style>
:root{
  --bg:#F4F6F5;--card:#FFFFFF;--ink:#0F1A17;--muted:#5C6B66;--line:#E1E7E4;--hover:#F0F4F2;
  --accent:#0E6B5B;--accentInk:#FFFFFF;--accentSoft:#DCF0EA;
  --good:#17703F;--goodSoft:#DAF0E2;--warn:#8F5A00;--warnSoft:#FAEBC9;--crit:#B0261D;--critSoft:#FADFDB;
  --radius:12px;--radiusSm:8px;
  --f:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fMono:ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1513;--card:#161F1C;--ink:#E4EEEA;--muted:#93A59E;--line:#26332F;--hover:#1B2724;
  --accent:#3DBFA0;--accentInk:#06211B;--accentSoft:#17352E;
  --good:#5FD08C;--goodSoft:#173324;--warn:#F0B84A;--warnSoft:#3A2D10;--crit:#FF8A7E;--critSoft:#3E1C18;
  color-scheme:dark;--shadow:0 1px 2px rgba(0,0,0,.2),0 4px 12px rgba(0,0,0,.3);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
button{cursor:pointer;border:0;background:none;font-weight:inherit}
button:disabled{opacity:.45;cursor:not-allowed}

/* Header */
.hdr{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px 0;padding-top:calc(14px + env(safe-area-inset-top))}
.hdr-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:18px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.brand .sub{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);background:var(--accentSoft);padding:2px 7px;border-radius:5px}
.hdr-user{font-size:12px;color:var(--muted);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:8px 14px;border-radius:18px;font-size:13px;font-weight:500;color:var(--muted);flex-shrink:0;white-space:nowrap;border:1px solid transparent}
.tabs button.on{background:var(--accent);color:var(--accentInk)}
.tabs .spacer{flex:1;min-width:8px}
.tabs .tab-add{background:var(--ink);color:var(--bg);font-weight:600;padding:8px 16px;border-radius:18px;font-size:13px}

/* Main */
.main{padding:16px;max-width:760px;margin:0 auto;padding-bottom:calc(32px + env(safe-area-inset-bottom))}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.card-pad{padding:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);gap:12px}
.card-h h3{font-size:14px;font-weight:600;letter-spacing:-.01em}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.kpi .l{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:3px;word-break:break-word}
.kpi .s{font-size:11px;color:var(--muted);margin-top:2px}

/* List items */
.list .item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.list .item:last-child{border-bottom:0}
.list .item:hover{background:var(--hover)}
.list .item .l{min-width:0;flex:1}
.list .item .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.list .item .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.list .item .r{display:flex;gap:8px;align-items:center;flex-shrink:0;text-align:right}

/* Pills */
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:9px;white-space:nowrap}
.pill.good{background:var(--goodSoft);color:var(--good)}
.pill.warn{background:var(--warnSoft);color:var(--warn)}
.pill.crit{background:var(--critSoft);color:var(--crit)}
.pill.info{background:var(--accentSoft);color:var(--accent)}
.pill.flat{background:var(--bg);color:var(--muted)}

/* Buttons */
.btn{padding:10px 16px;border-radius:var(--radiusSm);border:1px solid var(--line);background:var(--card);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentInk);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:6px}
.btn.danger{color:var(--crit)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.icon{padding:8px;border-radius:50%;width:36px;height:36px}
.btn.wide{width:100%}

/* Forms */
.field{display:block;margin-bottom:14px}
.field > span{display:block;font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.in,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radiusSm);background:var(--card);font-size:15px;font-weight:400;color:var(--ink)}
.in:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.in::placeholder{color:var(--muted);opacity:.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:480px){.grid3{grid-template-columns:1fr 1fr}}

/* Search */
.search{position:relative;margin-bottom:12px}
.search input{padding-left:38px}
.search::before{content:'🔍';position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.5;pointer-events:none}

/* Empty state */
.empty{padding:36px 20px;text-align:center}
.empty .big{font-size:44px;margin-bottom:10px;opacity:.5}
.empty p{color:var(--muted);margin-bottom:16px;font-size:14px}

/* Sheet / modal */
.sheet{position:fixed;inset:0;background:rgba(8,16,13,.55);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0}
.sheet[hidden]{display:none}
.panel{background:var(--card);width:100%;max-width:520px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;min-height:0;box-shadow:0 -8px 40px rgba(0,0,0,.2)}
.panel-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);flex-shrink:0;gap:12px}
.panel-h h2{font-size:17px;font-weight:700;letter-spacing:-.02em}
.panel-b{padding:18px;overflow-y:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.panel-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.x{font-size:26px;line-height:1;color:var(--muted);padding:0 6px;border-radius:6px}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:500;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:calc(100% - 40px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Login/setup screens */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.pane{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;width:100%;max-width:440px;box-shadow:var(--shadow)}
.pane .brand{margin-bottom:6px;font-size:24px}
.pane .lead{color:var(--muted);font-size:13px;margin-bottom:20px}
.pane h2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}

/* Spinner */
.spin{width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Step card */
.step{display:flex;gap:12px;padding:14px;background:var(--bg);border-radius:10px;margin-bottom:10px}
.step .n{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accentInk);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.step .b{flex:1;min-width:0}
.step .b strong{display:block;font-size:13px;margin-bottom:3px}
.step .b p{font-size:12px;color:var(--muted);margin-bottom:8px}
.mono-box{font-family:var(--fMono);font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:140px;overflow:auto;word-break:break-all;color:var(--muted);margin-top:6px}

/* Cart rows */
.cart-row{display:grid;grid-template-columns:1fr 70px 34px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cart-row:last-child{border-bottom:0}
.cart-row .q{text-align:center;padding:7px 4px;font-size:14px}
.cart-row .rm{width:34px;height:34px;border-radius:50%;color:var(--muted);font-size:18px}
.cart-row .rm:hover{background:var(--critSoft);color:var(--crit)}

/* Branch stock grid */
.branch-stock{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.branch-stock:last-child{border-bottom:0}
.branch-stock .name{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.branch-stock input{padding:8px;text-align:right}

/* Product picker */
.picker{position:relative}
.picker input{padding-left:38px}
.picker-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);max-height:280px;overflow:auto;z-index:10}
.picker-list[hidden]{display:none}
.picker-list button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px;background:none}
.picker-list button:last-child{border-bottom:0}
.picker-list button:hover{background:var(--hover)}
.picker-list .name{font-weight:500}
.picker-list .sub{font-size:12px;color:var(--muted);margin-top:1px}
.picker-list .price{font-weight:600;color:var(--accent);flex-shrink:0;padding-left:8px}

/* Desktop */
@media (min-width:640px){
  .kpis{grid-template-columns:repeat(4,1fr)}
  .main{padding:24px}
  .hdr{padding:18px 24px 0;padding-top:calc(18px + env(safe-area-inset-top))}
  .tabs{margin:14px -24px 0;padding:0 24px}
  .sheet{align-items:center;padding:24px}
  .panel{border-radius:16px;max-height:88vh}
}

@media (min-width:900px){
  .main{max-width:900px}
}
</style>
</head>
<body>

<div id="root"></div>
<div class="sheet" id="sheet" hidden>
  <div class="panel" id="panel"></div>
</div>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   Stockroom Live — multi-user app with Supabase backend
   ============================================================ */

var CFG_KEY = 'stockroom.config.v1';
var db = null;
var config = null;
var user = null;

var state = {
  branches: [],
  products: [],
  customers: [],
  orders: [],
  view: 'dash',
  loading: true,
  loaded: false,
  productQ: '',
  customerQ: ''
};

/* ---------- Utilities ---------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function money(n){return '৳'+Math.round(Number(n)||0).toLocaleString('en-IN')}
function num(n){return Number(n||0).toLocaleString('en-IN')}
function today(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dshort(s){
  if(!s)return '—';
  var p=String(s).split('-');
  return p[2]+'/'+p[1]+'/'+p[0];
}
function newId(prefix){
  return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}
var toastTimer;
function toast(msg){
  var t=$('#toast');
  t.textContent=msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('on')},2600);
}

/* ---------- Config ---------- */
function loadConfig(){
  try{
    var raw=localStorage.getItem(CFG_KEY);
    if(raw)return JSON.parse(raw);
  }catch(e){}
  return null;
}
function saveConfig(c){
  try{localStorage.setItem(CFG_KEY,JSON.stringify(c))}catch(e){}
}
function clearConfig(){
  try{localStorage.removeItem(CFG_KEY)}catch(e){}
}

/* ---------- SQL for setup ---------- */
var SETUP_SQL = [
'-- Stockroom setup. Paste into Supabase SQL Editor and Run.',
'',
'create table if not exists branches (',
'  id text primary key,',
'  name text not null,',
'  created_at timestamptz default now()',
');',
'',
'create table if not exists products (',
'  id text primary key,',
'  sku text default \'\',',
'  name text not null,',
'  category text default \'\',',
'  price numeric default 0,',
'  cost numeric default 0,',
'  reorder numeric default 0,',
'  stock jsonb default \'{}\'::jsonb,',
'  created_at timestamptz default now()',
');',
'',
'create table if not exists customers (',
'  id text primary key,',
'  name text not null,',
'  phone text default \'\',',
'  email text default \'\',',
'  address text default \'\',',
'  created_at timestamptz default now()',
');',
'',
'create table if not exists orders (',
'  id text primary key,',
'  date date not null default current_date,',
'  customer_id text,',
'  customer_name text default \'\',',
'  branch_id text,',
'  branch_name text default \'\',',
'  lines jsonb default \'[]\'::jsonb,',
'  total numeric default 0,',
'  paid boolean default false,',
'  created_at timestamptz default now()',
');',
'',
'alter table branches enable row level security;',
'alter table products enable row level security;',
'alter table customers enable row level security;',
'alter table orders enable row level security;',
'',
'drop policy if exists "branches_auth" on branches;',
'drop policy if exists "products_auth" on products;',
'drop policy if exists "customers_auth" on customers;',
'drop policy if exists "orders_auth" on orders;',
'',
'create policy "branches_auth" on branches for all to authenticated using (true) with check (true);',
'create policy "products_auth" on products for all to authenticated using (true) with check (true);',
'create policy "customers_auth" on customers for all to authenticated using (true) with check (true);',
'create policy "orders_auth" on orders for all to authenticated using (true) with check (true);'
].join('\n');

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  var root=$('#root');
  if(!config){
    root.innerHTML=renderSetup();
    return;
  }
  if(!user){
    root.innerHTML=renderAuth();
    return;
  }
  if(!state.loaded){
    root.innerHTML='<div class="center"><div class="pane" style="text-align:center">'+
      '<div class="spin"></div>'+
      '<p class="lead">Loading your data…</p>'+
    '</div></div>';
    return;
  }
  root.innerHTML=renderShell();
}

/* ---------- Setup screen ---------- */
function renderSetup(){
  return '<div class="center"><div class="pane">'+
    '<div class="brand"><span class="dot"></span>Stockroom</div>'+
    '<p class="lead">Connect to a free Supabase database to go live.</p>'+

    '<div class="step"><div class="n">1</div><div class="b">'+
      '<strong>Create a Supabase project</strong>'+
      '<p>Sign up at supabase.com (free) and create a new project.</p>'+
      '<a href="https://supabase.com/dashboard" target="_blank" rel="noopener" class="btn sm">Open Supabase →</a>'+
    '</div></div>'+

    '<div class="step"><div class="n">2</div><div class="b">'+
      '<strong>Run the database setup</strong>'+
      '<p>In Supabase, open <b>SQL Editor</b>, create a new query, paste this, and click Run.</p>'+
      '<button class="btn sm pri" data-act="copy-sql">📋 Copy SQL</button>'+
    '</div></div>'+

    '<div class="step"><div class="n">3</div><div class="b">'+
      '<strong>Paste your two keys</strong>'+
      '<p>Find them in Supabase → <b>Project Settings → API</b>.</p>'+
      '<label class="field" style="margin-top:8px"><span>Project URL</span>'+
        '<input class="in" id="cfg-url" placeholder="https://xxxxx.supabase.co" autocomplete="off" autocapitalize="off" spellcheck="false"></label>'+
      '<label class="field"><span>Anon public key</span>'+
        '<input class="in" id="cfg-key" placeholder="eyJhbGciOi..." autocomplete="off" autocapitalize="off" spellcheck="false"></label>'+
      '<div id="cfg-err" style="color:var(--crit);font-size:13px;margin-bottom:6px"></div>'+
      '<button class="btn pri wide" id="cfg-btn" data-act="connect">Connect</button>'+
    '</div></div>'+
  '</div></div>';
}

/* ---------- Auth screen ---------- */
function renderAuth(){
  return '<div class="center"><div class="pane">'+
    '<div class="brand"><span class="dot"></span>Stockroom</div>'+
    '<p class="lead">Sign in to access your shared data.</p>'+
    '<label class="field"><span>Email</span><input class="in" id="a-email" type="email" autocomplete="email" inputmode="email"></label>'+
    '<label class="field"><span>Password</span><input class="in" id="a-pass" type="password" autocomplete="current-password"></label>'+
    '<div id="a-err" style="color:var(--crit);font-size:13px;margin-bottom:10px;min-height:1em"></div>'+
    '<div style="display:flex;gap:8px">'+
      '<button class="btn pri" style="flex:1" data-act="signin">Sign in</button>'+
      '<button class="btn" style="flex:1" data-act="signup">Sign up</button>'+
    '</div>'+
    '<button class="btn ghost wide" style="margin-top:14px;font-size:13px" data-act="reconfig">Change database</button>'+
  '</div></div>';
}

/* ---------- App shell ---------- */
function renderShell(){
  var tabs=[
    {id:'dash',name:'Dashboard'},
    {id:'products',name:'Products'},
    {id:'customers',name:'Customers'},
    {id:'orders',name:'Orders'},
    {id:'branches',name:'Branches'}
  ];
  var tabHtml=tabs.map(function(t){
    return '<button data-act="tab" data-id="'+t.id+'" class="'+(state.view===t.id?'on':'')+'">'+t.name+'</button>';
  }).join('');
  var content='';
  if(state.view==='dash')content=renderDash();
  else if(state.view==='products')content=renderProducts();
  else if(state.view==='customers')content=renderCustomers();
  else if(state.view==='orders')content=renderOrders();
  else if(state.view==='branches')content=renderBranches();

  var uname=(user&&user.email)?user.email.split('@')[0]:'';

  return '<div class="hdr">'+
    '<div class="hdr-row">'+
      '<div class="brand"><span class="dot"></span>Stockroom<span class="sub">Live</span></div>'+
      '<button class="btn sm ghost" data-act="signout"><span class="hdr-user">'+esc(uname)+'</span> · Sign out</button>'+
    '</div>'+
    '<div class="tabs">'+tabHtml+'<div class="spacer"></div></div>'+
  '</div>'+
  '<main class="main">'+content+'</main>';
}

/* ---------- Dashboard ---------- */
function renderDash(){
  var stockValue=0, lowCount=0, outCount=0;
  state.products.forEach(function(p){
    var total=0;
    Object.keys(p.stock||{}).forEach(function(k){total+=Number(p.stock[k])||0});
    stockValue+=total*Number(p.cost||0);
    if(total<=0)outCount++;
    else if(total<=Number(p.reorder||0))lowCount++;
  });
  var totalSales=0, unpaid=0, unpaidCount=0;
  state.orders.forEach(function(o){
    totalSales+=Number(o.total||0);
    if(!o.paid){unpaid+=Number(o.total||0);unpaidCount++;}
  });
  var recent=state.orders.slice().sort(function(a,b){
    return String(b.date||'').localeCompare(String(a.date||''))
  }).slice(0,5);

  var html='<div class="kpis">'+
    '<div class="kpi"><div class="l">Stock value</div><div class="v">'+money(stockValue)+'</div><div class="s">'+state.products.length+' products</div></div>'+
    '<div class="kpi"><div class="l">Total sales</div><div class="v">'+money(totalSales)+'</div><div class="s">'+state.orders.length+' orders</div></div>'+

async function saveProduct(id){
  var name=$('#p-name').value.trim();
  if(!name){toast('Enter a product name');return}
  var stock={};
  $$('[data-stock-branch]').forEach(function(inp){
    var v=Number(inp.value)||0;
    if(v>0||v===0)stock[inp.getAttribute('data-stock-branch')]=v;
  });
  var data={
    sku:$('#p-sku').value.trim(),
    name:name,
    category:$('#p-cat').value.trim(),
    price:Number($('#p-price').value)||0,
    cost:Number($('#p-cost').value)||0,
    reorder:Number($('#p-reorder').value)||0,
    stock:stock
  };
  try{
    if(id){
      var r=await db.from('products').update(data).eq('id',id);
      if(r.error)throw r.error;
      var i=state.products.findIndex(function(x){return x.id===id});
      if(i>=0)state.products[i]=Object.assign({},state.products[i],data);
      toast('Product saved');
    } else {
      data.id=newId('P');
      var r2=await db.from('products').insert([data]).select().single();
      if(r2.error)throw r2.error;
      state.products.push(r2.data);
      toast('Product added');
    }
    closeSheet();
    render();
  }catch(e){
    toast('Could not save: '+(e.message||e));
  }
}

async function deleteProduct(id){
  if(!confirm('Delete this product?'))return;
  try{
    var r=await db.from('products').delete().eq('id',id);
    if(r.error)throw r.error;
    state.products=state.products.filter(function(x){return x.id!==id});
    closeSheet();
    toast('Product deleted');
    render();
  }catch(e){
    toast('Delete failed: '+(e.message||e));
  }
}

async function saveBranch(id){
  var code=(isEdit_safe(id)?id:$('#b-id').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,''));
  var name=$('#b-name').value.trim();
  if(!code){toast('Enter a branch code');return}
  if(!name){toast('Enter a branch name');return}
  if(code.length<2||code.length>8){toast('Branch code must be 2-8 characters');return}

  try{
    if(id){
      var r=await db.from('branches').update({name:name}).eq('id',id);
      if(r.error)throw r.error;
      var i=state.branches.findIndex(function(x){return x.id===id});
      if(i>=0)state.branches[i].name=name;
      toast('Branch saved');
    } else {
      if(state.branches.some(function(x){return x.id===code})){toast('That branch code already exists');return}
      var r2=await db.from('branches').insert([{id:code,name:name}]).select().single();
      if(r2.error)throw r2.error;
      state.branches.push(r2.data);
      toast('Branch added');
    }
    closeSheet();
    render();
  }catch(e){
    toast('Could not save: '+(e.message||e));
  }
}
function isEdit_safe(id){return !!id}

async function deleteBranch(id){
  var hasStock=false;
  state.products.forEach(function(p){
    if(Number((p.stock||{})[id])>0)hasStock=true;
  });
  if(hasStock){
    if(!confirm('This branch has stock in some products. Delete anyway? Stock counts will be lost.'))return;
  } else {
    if(!confirm('Delete this branch?'))return;
  }
  try{
    var r=await db.from('branches').delete().eq('id',id);
    if(r.error)throw r.error;
    state.branches=state.branches.filter(function(x){return x.id!==id});
    // Clean up branch keys from product stock
    for(var i=0;i<state.products.length;i++){
      if(state.products[i].stock&&state.products[i].stock[id]!==undefined){
        var s=Object.assign({},state.products[i].stock);
        delete s[id];
        state.products[i].stock=s;
        await db.from('products').update({stock:s}).eq('id',state.products[i].id);
      }
    }
    closeSheet();
    toast('Branch deleted');
    render();
  }catch(e){
    toast('Delete failed: '+(e.message||e));
  }
}

      '<div class="grid2">'+
        '<label class="field"><span>Branch</span><select class="in" id="o-branch">'+branchOpts+'</select></label>'+
        '<label class="field"><span>Date</span><input class="in" id="o-date" type="date" value="'+esc(d.date)+'"></label>'+
      '</div>'+
      '<label class="field"><span>Add products</span>'+
        '<div class="picker">'+
          '<input class="in" id="o-search" placeholder="Search product name, SKU…" autocomplete="off">'+
          '<div class="picker-list" id="o-list" hidden></div>'+
        '</div>'+
      '</label>'+
      '<div style="margin:6px 0 6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">Items</div>'+
      '<div>'+cartHtml+'</div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">'+
        '<label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer"><input type="checkbox" id="o-paid" '+(d.paid?'checked':'')+'> Mark as paid</label>'+
        '<div style="text-align:right"><div class="s">Total</div><div style="font-size:20px;font-weight:700">'+money(total)+'</div></div>'+
      '</div>'+
    '</div>'+
    '<div class="panel-f">'+
      '<button class="btn" data-act="close">Cancel</button>'+
      '<button class="btn pri" data-act="save-order">Create order</button>'+
    '</div>'
  );

  var s=$('#o-search');
  if(s){
    s.addEventListener('input',function(){orderSearch(this.value)});
    s.addEventListener('focus',function(){orderSearch(this.value)});
  }
  var sel=$('#o-cust');if(sel)sel.addEventListener('change',function(){orderDraft.customer_id=this.value});
  var sel2=$('#o-branch');if(sel2)sel2.addEventListener('change',function(){orderDraft.branch_id=this.value});
  var dt=$('#o-date');if(dt)dt.addEventListener('change',function(){orderDraft.date=this.value});
  var pd=$('#o-paid');if(pd)pd.addEventListener('change',function(){orderDraft.paid=this.checked});
}

function orderSearch(q){
  var list=$('#o-list');
  if(!list)return;
  q=String(q||'').trim().toLowerCase();
  var items=state.products.filter(function(p){
    if(!q)return true;
    return String(p.name+' '+p.sku+' '+p.category).toLowerCase().indexOf(q)>-1;
  }).slice(0,20);

  if(!items.length){
    list.innerHTML='<div style="padding:14px;color:var(--muted);text-align:center;font-size:13px">No products found</div>';
    list.hidden=false;
    return;
  }
  list.innerHTML=items.map(function(p){
    var total=0;
    Object.keys(p.stock||{}).forEach(function(k){total+=Number(p.stock[k])||0});
    return '<button type="button" data-act="pick-product" data-id="'+esc(p.id)+'">'+
      '<span><div class="name">'+esc(p.name)+'</div><div class="sub">'+esc(p.sku||'—')+' · '+num(total)+' in stock</div></span>'+
      '<span class="price">'+money(p.price)+'</span>'+
    '</button>';
  }).join('');
  list.hidden=false;
}

function pickProduct(id){
  var p=state.products.find(function(x){return x.id===id});
  if(!p)return;
  var existing=orderDraft.lines.find(function(l){return l.productId===id});
  if(existing)existing.qty+=1;
  else orderDraft.lines.push({productId:id,qty:1,price:Number(p.price)||0});
  renderOrderForm();
  var s=$('#o-search');
  if(s){s.value='';s.focus()}
}

async function saveOrder(){
  var d=orderDraft;
  if(!d.customer_id){toast('Select a customer');return}
  if(!d.branch_id){toast('Select a branch');return}
  if(!d.lines.length){toast('Add at least one product');return}

  var cust=state.customers.find(function(x){return x.id===d.customer_id});
  var br=state.branches.find(function(x){return x.id===d.branch_id});
  var total=0;
  d.lines.forEach(function(l){total+=l.qty*l.price});

  var order={
    id: newId('O'),
    date: d.date,
    customer_id: d.customer_id,
    customer_name: cust?cust.name:'',
    branch_id: d.branch_id,
    branch_name: br?br.name:'',
    lines: d.lines.map(function(l){return {productId:l.productId,qty:l.qty,price:l.price}}),
    total: total,
    paid: d.paid
  };

  try{
    var r=await db.from('orders').insert([order]).select().single();
    if(r.error)throw r.error;
    // Deduct stock at the chosen branch
    for(var i=0;i<d.lines.length;i++){
      var line=d.lines[i];
      var p=state.products.find(function(x){return x.id===line.productId});
      if(!p)continue;
      var s=Object.assign({},p.stock||{});
      s[d.branch_id]=Math.max(0,(Number(s[d.branch_id])||0)-line.qty);
      var ur=await db.from('products').update({stock:s}).eq('id',p.id);
      if(!ur.error){
        p.stock=s;
      }
    }
    state.orders.unshift(r.data);
    closeSheet();
    toast('Order created');
    state.view='orders';
    render();
  }catch(e){
    toast('Could not save: '+(e.message||e));
  }
}

function openOrder(id){
  var o=state.orders.find(function(x){return x.id===id});
  if(!o)return;
  var rows=(o.lines||[]).map(function(l){
    var p=state.products.find(function(x){return x.id===l.productId})||{name:'(deleted)'};
    return '<div class="item" style="cursor:default">'+
      '<div class="l"><div class="n">'+esc(p.name)+'</div><div class="s">'+l.qty+' × '+money(l.price)+'</div></div>'+
      '<div class="r" style="font-weight:600">'+money(l.qty*l.price)+'</div>'+
    '</div>';
  }).join('');

  openSheet(
    '<div class="panel-h"><h2>Order '+esc(o.id.slice(-6).toUpperCase())+'</h2><button class="x" data-act="close">×</button></div>'+
    '<div class="panel-b">'+
      '<div class="s">'+dshort(o.date)+' · '+esc(o.branch_name||'')+'</div>'+
      '<div style="font-size:16px;font-weight:600;margin-top:4px">'+esc(o.customer_name||'—')+'</div>'+
      '<div style="margin-top:14px">'+rows+'</div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">'+
        '<div><div class="s">Payment</div><span class="pill '+(o.paid?'good':'warn')+'">'+(o.paid?'Paid':'Due')+'</span></div>'+
        '<div style="text-align:right"><div class="s">Total</div><div style="font-size:22px;font-weight:700">'+money(o.total)+'</div></div>'+
      '</div>'+
    '</div>'+
    '<div class="panel-f">'+
      '<button class="btn danger" data-act="del-order" data-id="'+esc(o.id)+'">Delete</button>'+
      '<button class="btn" data-act="toggle-paid" data-id="'+esc(o.id)+'">'+(o.paid?'Mark unpaid':'Mark paid')+'</button>'+
      '<button class="btn pri" data-act="close">Close</button>'+
    '</div>'
  );
}

/* ============================================================
   LOAD DATA
   ============================================================ */
async function loadAll(){
  state.loaded=false;
  render();
  try{
    var results=await Promise.all([
      db.from('branches').select('*').order('name'),
      db.from('products').select('*').order('name'),
      db.from('customers').select('*').order('name'),
      db.from('orders').select('*').order('date',{ascending:false})
    ]);
    for(var i=0;i<results.length;i++){
      if(results[i].error)throw results[i].error;
    }
    state.branches=results[0].data||[];
    state.products=results[1].data||[];
    state.customers=results[2].data||[];
    state.orders=results[3].data||[];
    state.loaded=true;
  }catch(e){
    toast('Load failed: '+(e.message||e));
    state.loaded=true; // show empty state instead of infinite spinner
  }
  render();
}

/* ============================================================
   AUTH
   ============================================================ */
async function signIn(){
  var email=$('#a-email').value.trim();
  var pass=$('#a-pass').value;
  var err=$('#a-err');
  err.textContent='';
  if(!email||!pass){err.textContent='Enter email and password.';return}
  try{
    var r=await db.auth.signInWithPassword({email:email,password:pass});
    if(r.error)throw r.error;
    user=r.data.user;
    await loadAll();
  }catch(e){
    err.textContent=e.message||'Sign-in failed.';
  }
}

async function signUp(){
  var email=$('#a-email').value.trim();
  var pass=$('#a-pass').value;
  var err=$('#a-err');
  err.textContent='';
  if(!email||!pass){err.textContent='Enter email and password.';return}
  if(pass.length<6){err.textContent='Password must be at least 6 characters.';return}
  try{
    var r=await db.auth.signUp({email:email,password:pass});
    if(r.error)throw r.error;
    if(r.data.session){
      user=r.data.user;
      await loadAll();
    } else {
      err.style.color='var(--good)';
      err.textContent='Account created. Check your email to confirm, then sign in.';
    }
  }catch(e){
    err.style.color='var(--crit)';
    err.textContent=e.message||'Sign-up failed.';
  }
}

async function signOut(){
  try{await db.auth.signOut()}catch(e){}
  user=null;
  state.branches=[];
  state.products=[];
  state.customers=[];
  state.orders=[];
  state.loaded=false;
  render();
}

/* ============================================================
   CONNECT
   ============================================================ */
async function connect(){
  var url=$('#cfg-url').value.trim().replace(/\/+$/,'');
  var key=$('#cfg-key').value.trim();
  var err=$('#cfg-err');
  var btn=$('#cfg-btn');
  err.textContent='';
  if(!url||!key){err.textContent='Both fields are required.';return}
  if(!/^https:\/\/.+\.supabase\.co$/.test(url)){
    err.textContent='URL should look like https://xxxxx.supabase.co';
    return;
  }
  btn.disabled=true;
  btn.textContent='Connecting…';
  try{
    var test=window.supabase.createClient(url,key);
    var r=await test.from('branches').select('id',{head:true,count:'exact'}).limit(1);
    if(r.error)throw r.error;
    // Success — save and initialize
    config={url:url,key:key};
    saveConfig(config);
    db=test;
    var sr=await db.auth.getSession();
    if(sr.data.session){
      user=sr.data.session.user;
      await loadAll();
    } else {
      render();
    }
  }catch(e){
    err.textContent='Could not connect: '+(e.message||e)+'. Have you run the SQL setup?';
    btn.disabled=false;
    btn.textContent='Connect';
  }
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click',function(e){
  // close picker if clicking outside
  var list=$('#o-list');
  if(list&&!e.target.closest('.picker'))list.hidden=true;

  if(e.target.id==='sheet'){closeSheet();return}

  var t=e.target.closest('[data-act]');
  if(!t)return;
  var act=t.getAttribute('data-act');
  var id=t.getAttribute('data-id');

  switch(act){
    case 'tab': state.view=id; render(); break;
    case 'close': closeSheet(); break;
    case 'signout': signOut(); break;
    case 'signin': signIn(); break;
    case 'signup': signUp(); break;
    case 'connect': connect(); break;
    case 'reconfig':
      if(confirm('Disconnect from current database?')){
        clearConfig();
        try{db&&db.auth.signOut()}catch(e){}
        user=null; db=null; config=null;
        render();
      }
      break;
    case 'copy-sql':
      copyText(SETUP_SQL);
      break;
    case 'add-product': productForm(); break;
    case 'edit-product': productForm(id); break;
    case 'save-product': saveProduct(id); break;
    case 'del-product': deleteProduct(id); break;
    case 'add-customer': customerForm(); break;
    case 'edit-customer': customerForm(id); break;
    case 'save-customer': saveCustomer(id); break;
    case 'del-customer': deleteCustomer(id); break;
    case 'add-branch': branchForm(); break;
    case 'edit-branch': branchForm(id); break;
    case 'save-branch': saveBranch(id); break;
    case 'del-branch': deleteBranch(id); break;
    case 'add-order': orderForm(); break;
    case 'open-order': openOrder(id); break;
    case 'pick-product': pickProduct(id); break;
    case 'save-order': saveOrder(); break;
    case 'rm-line':
      orderDraft.lines.splice(Number(t.getAttribute('data-i')),1);
      renderOrderForm();
      break;
    case 'toggle-paid':
      togglePaid(id);
      break;
    case 'del-order':
      delOrder(id);
      break;
  }
});

document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='p-q'){state.productQ=t.value;render()}
  else if(t.id==='c-q'){state.customerQ=t.value;render()}
  else if(t.id==='o-search'){orderSearch(t.value)}
  else if(t.hasAttribute&&t.hasAttribute('data-line-qty')){
    var i=Number(t.getAttribute('data-line-qty'));
    var v=Math.max(1,parseInt(t.value,10)||1);
    if(orderDraft&&orderDraft.lines[i]){
      orderDraft.lines[i].qty=v;
      var total=0;
      orderDraft.lines.forEach(function(l){total+=l.qty*l.price});
      var tot=document.querySelector('.panel-b div[style*="text-align:right"] .tot, .panel-b .tot');
      // simple: re-render the total at the bottom
      var nodes=document.querySelectorAll('.panel-b div[style*="font-size:20px"]');
      if(nodes[0])nodes[0].textContent=money(total);
    }
  }
});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeSheet();
});

async function togglePaid(id){
  var o=state.orders.find(function(x){return x.id===id});
  if(!o)return;
  var newPaid=!o.paid;
  try{
    var r=await db.from('orders').update({paid:newPaid}).eq('id',id);
    if(r.error)throw r.error;
    o.paid=newPaid;
    closeSheet();
    toast(newPaid?'Marked paid':'Marked unpaid');
    render();
  }catch(e){
    toast('Failed: '+(e.message||e));
  }
}

async function delOrder(id){
  if(!confirm('Delete this order? Stock will not be restored.'))return;
  try{
    var r=await db.from('orders').delete().eq('id',id);
    if(r.error)throw r.error;
    state.orders=state.orders.filter(function(x){return x.id!==id});
    closeSheet();
    toast('Order deleted');
    render();
  }catch(e){
    toast('Failed: '+(e.message||e));
  }
}

function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      toast('SQL copied to clipboard');
    },function(){
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text;
  ta.style.position='fixed';
  ta.style.left='-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand('copy');toast('SQL copied')}catch(e){toast('Copy failed — select manually')}
  document.body.removeChild(ta);
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  config=loadConfig();
  if(config&&config.url&&config.key){
    if(!window.supabase){
      config=null;
      render();
      return;
    }
    db=window.supabase.createClient(config.url,config.key);
    try{
      var r=await db.auth.getSession();
      if(r.data.session){
        user=r.data.session.user;
        await loadAll();
        return;
      }
    }catch(e){}
  }
  render();
}

boot();
</script>
