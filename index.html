<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stockroom</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F1F4F3;--surface:#FFFFFF;--ink:#13211D;--muted:#566762;--line:#D9E1DE;--hover:#F0F6F4;
  --accent:#0E6B5B;--accent-ink:#FFFFFF;--accent-soft:#D9EFE9;
  --good:#17703F;--good-soft:#DAF0E2;--warn:#8F5A00;--warn-soft:#FAEBC9;--crit:#B0261D;--crit-soft:#FADFDB;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1513;--surface:#161F1C;--ink:#E4EEEA;--muted:#93A59E;--line:#26332F;--hover:#1B2724;
  --accent:#3DBFA0;--accent-ink:#06211B;--accent-soft:#17352E;
  --good:#5FD08C;--good-soft:#173324;--warn:#F0B84A;--warn-soft:#3A2D10;--crit:#FF8A7E;--crit-soft:#3E1C18;color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;margin:0}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px}
.sub{color:var(--muted);font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;align-self:start;max-height:100dvh;overflow:auto;padding:20px 12px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:16px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;padding:0 8px;display:flex;align-items:baseline;gap:8px}
.brand small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:2px 6px;border-radius:4px;font-family:var(--f-body);font-weight:600}
#nav{display:flex;flex-direction:column;gap:2px}
#nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px;cursor:pointer;color:var(--muted);font-weight:500;font-size:14px}
#nav button:hover{background:var(--hover);color:var(--ink)}
#nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{font-size:11px;background:var(--bg);color:var(--muted);border-radius:10px;padding:1px 7px;font-weight:600}
#nav button[aria-current="page"] .badge{background:var(--surface);color:var(--accent)}
.who{display:flex;align-items:center;gap:8px;padding:8px;border-top:1px solid var(--line);font-size:12px;margin-top:auto;flex-wrap:wrap}
.who b{display:block;font-size:13px}
main{min-width:0;padding:20px clamp(16px,3vw,32px) 48px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.015em}
.scope{display:flex;align-items:center;gap:8px}
.scope label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.in,select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:36px;max-width:100%;width:100%}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 14px;min-height:36px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:28px;padding:3px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .in,.toolbar select{width:auto;flex:0 1 auto}
.grow{flex:1 1 220px!important;min-width:0;width:auto!important}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip b{margin-left:4px;font-weight:600}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th.num{text-align:right}
td{padding:9px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
tbody tr[data-act]{cursor:pointer}
tbody tr[data-act]:hover td{background:var(--hover)}
td.nw{white-space:nowrap}
.pn{font-weight:500}
.c-low{color:var(--warn);font-weight:600}
.c-out{color:var(--crit);font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:10px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.idle{background:var(--bg);color:var(--muted)}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line);border-top:1px solid var(--line);margin:-1px 0 0 -1px}
.kpi .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-weight:600;font-size:26px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3{font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3 span{font-weight:500;color:var(--muted);font-size:12px}
.bars{display:flex;flex-direction:column;gap:10px}
.bars li{display:grid;grid-template-columns:minmax(80px,1fr) 2fr auto;gap:10px;align-items:center}
.bt{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.bt i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bv{font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
.rows li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0;padding-top:0}
.rows .main{min-width:0;flex:1}
.rows .main div:first-child{font-weight:500}
.rows .end{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.rows li[data-act]{cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(8,16,13,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{background:var(--surface);border-radius:12px;width:100%;max-width:640px;max-height:100%;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.3);min-height:0}
.sheet.wide{max-width:860px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-family:var(--f-display);font-size:20px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.x{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:0 6px}
.sheet-b{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px;min-height:0}
.sheet-f{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.meta div span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.f input,.f select{font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink)}
.addrow{position:relative}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:5;max-height:280px;overflow:auto}
.sg{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px;cursor:pointer}
.sg:hover{background:var(--hover)}
.sg:last-child{border-bottom:0}
.sg.none{color:var(--muted);cursor:default}
input.qty{width:84px;text-align:right}
tr.err td{background:var(--crit-soft)}
.msg{color:var(--crit);font-size:13px;font-weight:500}
.tot{font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.adj{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.adj .f{flex:1 1 130px}
h4{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.callout{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13px}
.callout.warn{background:var(--warn-soft)}
#toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#setup,#login{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#setup[hidden],#login[hidden]{display:none}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:560px;display:flex;flex-direction:column;gap:16px;margin:auto}
.box .brand{font-size:26px;padding:0}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px}
.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.step .b{flex:1;display:flex;flex-direction:column;gap:8px}
.step .b b{font-size:13px}
.codebox{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--f-mono);font-size:11px;line-height:1.5;max-height:180px;overflow:auto;white-space:pre;color:var(--muted)}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px 8px;gap:8px}
  #nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  #nav button{width:auto;white-space:nowrap}
  .who{display:none}
}
</style>
</head>
<body>

<div class="app" id="app" hidden>
  <aside class="rail">
    <div class="brand">Stockroom<small id="modeTag">Local</small></div>
    <nav id="nav"></nav>
    <div class="who" id="who"></div>
  </aside>
  <main>
    <header class="top">
      <h1 id="viewTitle">Overview</h1>
      <div class="scope"><label for="branchSel">Branch</label><select id="branchSel" style="width:auto"></select></div>
    </header>
    <section id="view"></section>
  </main>
</div>

<div id="overlay" class="overlay" hidden><div id="sheetHost" style="display:contents"></div></div>
<div id="setup" hidden></div>
<div id="login" hidden></div>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   CONFIG — stored in localStorage so you only paste it once.
   ═══════════════════════════════════════════════════════════════ */
const CFG_KEY='stockroom.cfg';
const DB_KEY='stockroom.local.db';
function getCfg(){try{return JSON.parse(localStorage.getItem(CFG_KEY)||'null')}catch(e){return null}}
function setCfg(c){localStorage.setItem(CFG_KEY,JSON.stringify(c))}
function clearCfg(){localStorage.removeItem(CFG_KEY)}

let SUPABASE_URL='', SUPABASE_ANON_KEY='', db=null, LIVE=false;

/* ═══════════════════════════════════════════════════════════════
   Static reference data
   ═══════════════════════════════════════════════════════════════ */
const BRANCHES=[
  {id:'DHK',name:'Dhaka Hub',scale:2.2},
  {id:'CTG',name:'Chattogram',scale:1.3},
  {id:'RAJ',name:'Rajshahi',scale:1.0},
  {id:'KHL',name:'Khulna',scale:0.9}
];
const CATS=[
  {code:'DEV',name:'Diffuser devices'},{code:'OIL',name:'Fragrance oils'},
  {code:'BLK',name:'Bulk oil (kg)'},{code:'RDS',name:'Room scents'},
  {code:'PKG',name:'Packaging'},{code:'DAI',name:'Dairy'},
  {code:'BEV',name:'Beverages'},{code:'HHD',name:'Household'}
];
const CATBY={};CATS.forEach(c=>CATBY[c.code]=c);
const SCENTS=['Oud Royale','White Musk','Amber Wood','Jasmine Night','Sandalwood','Rose Garden','Citrus Fresh','Ocean Breeze'];
const DENSITY={};SCENTS.forEach(s=>DENSITY[s]=0.92);
const CTYPES=['Hotel or resort','Office','Clinic','Spa or salon','Restaurant or cafe','Retail or showroom','Reseller'];
const RCATS=['Small room','Medium room','Large space','HVAC duct'];
const RITEMS=[
  {id:'r0',code:'FLT-001',name:'Aeroscent Mini',cat:'Small room',fee:1200,deposit:3000,value:7500,oil_ml:60,coverage:'30 m²'},
  {id:'r1',code:'FLT-002',name:'Aeroscent Pro',cat:'Medium room',fee:2800,deposit:8000,value:18000,oil_ml:150,coverage:'100 m²'},
  {id:'r2',code:'FLT-003',name:'Mistral Wall 500',cat:'Large space',fee:5000,deposit:15000,value:35000,oil_ml:300,coverage:'200 m²'},
  {id:'r3',code:'FLT-004',name:'Mistral Tower 800',cat:'Large space',fee:6500,deposit:20000,value:48000,oil_ml:400,coverage:'300 m²'},
  {id:'r4',code:'FLT-005',name:'HVAC Duct 1000',cat:'HVAC duct',fee:12000,deposit:40000,value:90000,oil_ml:800,coverage:'1,000 m²'}
];
const RBY={};RITEMS.forEach(r=>RBY[r.id]=r);
const SUPS=[
  {id:'S1',name:'Green Valley Dairy Farms',cats:['DAI']},
  {id:'S2',name:'Delta Beverage Traders',cats:['BEV']},
  {id:'S8',name:'Aeroscent Devices Factory',cats:['DEV']},
  {id:'S9',name:'Oud & Essence Co.',cats:['OIL','BLK']},
  {id:'S11',name:'Aroma House Home Scents',cats:['RDS']},
  {id:'S12',name:'Glasspack Industries',cats:['PKG']},
  {id:'S13',name:'Metro Wholesale Depot',cats:CATS.map(c=>c.code)}
];
const SUPBY={};SUPS.forEach(s=>SUPBY[s.id]=s);

/* ═══════════════════════════════════════════════════════════════
   Runtime
   ═══════════════════════════════════════════════════════════════ */
const PRODUCTS=[],ORDERS=[],CONTRACTS=[],CUSTOMERS=[],POS=[],TRANSFERS=[],FLEET=[];
const byId={};
let session=null;
let SETTINGS={vatRate:0,vatInclusive:false,approvalThreshold:100000,min:{}};
let counters={so:24180,po:3040,tr:7010,rc:4100};
const today=new Date();today.setHours(12,0,0,0);
const TODAY_ISO=iso(today);
const state={view:'overview',branch:'all',
  inv:{q:'',cat:'all',st:'all',page:0},ord:{st:'All',q:'',page:0},
  ct:{st:'All',q:''},rf:{st:'Pending',q:''},cust:{q:''},fl:{q:'',cat:'all'}};

/* ═══════════════════════════════════════════════════════════════
   Helpers
   ═══════════════════════════════════════════════════════════════ */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const pad=(n,l)=>String(n).padStart(l,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addM=(s,n)=>{const p=s.split('-').map(Number);const dim=new Date(p[0],p[1]-1+n+1,0).getDate();return iso(new Date(p[0],p[1]-1+n,Math.min(p[2],dim),12))};
const cEnd=(s,m)=>iso(addDays(new Date(addM(s,m)+'T12:00:00'),-1));
const dshort=s=>{if(!s)return '—';const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en-GB',{day:'numeric',month:'short'})};
const dayDiff=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'৳'+Math.round(n||0).toLocaleString('en-IN');
const num=n=>Math.round(n||0).toLocaleString('en-IN');
const qf=(p,q)=>p.unit?(+(+q).toFixed(2)).toLocaleString('en-IN'):num(q);
const nowT=()=>{const d=new Date();return pad(d.getHours(),2)+':'+pad(d.getMinutes(),2)};
const bname=id=>{const b=BRANCHES.find(x=>x.id===id);return b?b.name:id};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3400)}
const minFor=(p,b)=>{const o=SETTINGS.min[p.id];if(o&&o[b]!=null)return o[b];return Math.ceil((p.rl||0)*(BRANCHES.find(x=>x.id===b)||{scale:1}).scale)};
const kgOf=(ml,sc)=>ml*(DENSITY[sc]||0.92)/1000;
const bulkProd=sc=>PRODUCTS.find(p=>p.cat==='BLK'&&p.scent===sc);
const custByName=n=>CUSTOMERS.find(c=>c.name===n);
const orderSub=o=>(o.lines||[]).reduce((s,l)=>s+l.qty*l.price,0);
const orderTotal=o=>Math.max(0,orderSub(o)-(o.discount||0));
const cMonthly=c=>(c.lines||[]).reduce((s,l)=>s+l.qty*l.fee,0);
const cUnits=c=>(c.lines||[]).reduce((s,l)=>s+l.qty,0);
const cstat=c=>{if(c.status==='Ended'||c.status==='Reserved')return c.status;const e=c.end_date;if(e<TODAY_ISO)return 'Expired';if(dayDiff(TODAY_ISO,e)<=30)return 'Ending soon';return 'Active'};
const rfstat=r=>{if(r.status!=='Scheduled')return r.status;if(r.due<TODAY_ISO)return 'Overdue';if(r.due===TODAY_ISO)return 'Due today';return 'Scheduled'};
const ORD_FLOW={'New':['Packed','Mark packed'],'Packed':['Out for delivery','Dispatch'],'Out for delivery':['Delivered','Deliver']};
const pillFor=s=>({'New':'idle','Packed':'info','Out for delivery':'warn','Delivered':'good','Ordered':'warn','Received':'good','Completed':'good','Pending approval':'warn','Approved':'good','Rejected':'crit','Active':'good','Ending soon':'warn','Expired':'crit','Ended':'idle','Reserved':'info'}[s]||'idle');
const pill=(t,c)=>`<span class="pill ${c||pillFor(t)}">${esc(t)}</span>`;
const STAT=[['OK','good'],['Low','warn'],['Out','crit']];
const table=(head,rows)=>`<div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
const barList=(items,fmt)=>{const max=Math.max.apply(null,items.map(i=>i.v).concat([1]));
  return `<ul class="bars">${items.map(i=>`<li><span>${esc(i.l)}</span><span class="bt"><i style="width:${(i.v/max*100).toFixed(1)}%"></i></span><span class="bv">${fmt(i.v)}</span></li>`).join('')}</ul>`};
const pstat=p=>{let w=0;BRANCHES.forEach(b=>{const q=(p.stock||{})[b.id]||0,m=minFor(p,b.id);const s=q<=0?2:q<=m?1:0;if(s>w)w=s});return w};
const fOutNow=(it,b)=>{let n=0;CONTRACTS.forEach(c=>{if(c.status==='Active'&&c.branch===b)(c.lines||[]).forEach(l=>{if(l.rid===it.id)n+=l.qty})});return n};
const scopeBranches=()=>state.branch==='all'?BRANCHES:BRANCHES.filter(b=>b.id===state.branch);
const inScope=x=>state.branch==='all'||x.branch===state.branch||x.from_branch===state.branch||x.to_branch===state.branch;
function alerts(){const out=[];PRODUCTS.forEach(p=>scopeBranches().forEach(b=>{const q=(p.stock||{})[b.id]||0,m=minFor(p,b.id);if(q<=m)out.push({p,b:b.id,q,m})}));
  return out.sort((a,b)=>((a.q===0?0:1)-(b.q===0?0:1))||(a.q/a.m-b.q/b.m))}

const Store={
  /* load everything into arrays */
  async load(){
    if(LIVE){
      const [p,o,c,cu,po,tr,fl,se]=await Promise.all([
        db.from('products').select('*'),
        db.from('orders').select('*').order('date',{ascending:false}),
        db.from('contracts').select('*'),
        db.from('customers').select('*'),
        db.from('pos').select('*'),
        db.from('transfers').select('*'),
        db.from('fleet').select('*'),
        db.from('settings').select('*')
      ]);
      PRODUCTS.length=0;ORDERS.length=0;CONTRACTS.length=0;CUSTOMERS.length=0;
      POS.length=0;TRANSFERS.length=0;FLEET.length=0;
      Object.keys(byId).forEach(k=>delete byId[k]);
      (p.data||[]).forEach(x=>{PRODUCTS.push(x);byId[x.id]=x});
      (o.data||[]).forEach(x=>ORDERS.push(x));
      (c.data||[]).forEach(x=>CONTRACTS.push(x));
      (cu.data||[]).forEach(x=>CUSTOMERS.push(x));
      (po.data||[]).forEach(x=>POS.push(x));
      (tr.data||[]).forEach(x=>TRANSFERS.push(x));
      (fl.data||[]).forEach(x=>FLEET.push(x));
      const s={};(se.data||[]).forEach(x=>s[x.key]=x.value);
      SETTINGS=Object.assign({vatRate:0,vatInclusive:false,approvalThreshold:100000,min:{}},s);
      if(!SETTINGS.min)SETTINGS.min={};
      if(s.counters)counters=Object.assign(counters,s.counters);
    }else{
      const raw=localStorage.getItem(DB_KEY);
      if(raw){try{const d=JSON.parse(raw);applySnapshot(d)}catch(e){console.warn('bad local save')}}
    }
  },
  async save(){
    if(LIVE)return; // live saves happen per-operation
    try{localStorage.setItem(DB_KEY,JSON.stringify(snapshot()))}catch(e){console.warn(e)}
  },
  /* single-row operations */
  async insertProduct(p){
    PRODUCTS.push(p);byId[p.id]=p;
    if(LIVE)await db.from('products').insert([stripLocal(p)]);
    else await this.save();
  },
  async updateProduct(p){
    if(LIVE)await db.from('products').update({stock:p.stock,name:p.name,price:p.price,cost:p.cost,rl:p.rl}).eq('id',p.id);
    else await this.save();
  },
  async insertOrder(o){
    ORDERS.unshift(o);
    if(LIVE){const r=await db.from('orders').insert([stripLocal(o)]).select().single();if(r.data)o.id=r.data.id}
    else await this.save();
  },
  async updateOrder(o){
    if(LIVE)await db.from('orders').update({status:o.status,paid:o.paid}).eq('id',o.id);
    else await this.save();
  },
  async insertCustomer(c){
    CUSTOMERS.push(c);
    if(LIVE){const r=await db.from('customers').insert([stripLocal(c)]).select().single();if(r.data)c.id=r.data.id}
    else await this.save();
  },
  async updateCustomer(c){
    if(LIVE)await db.from('customers').update({credit:c.credit||0,limit_:c.limit_||50000}).eq('id',c.id);
    else await this.save();
  },
  async insertContract(c){
    CONTRACTS.push(c);
    if(LIVE){const r=await db.from('contracts').insert([stripLocal(c)]).select().single();if(r.data)c.id=r.data.id}
    else await this.save();
  },
  async updateContract(c){
    if(LIVE)await db.from('contracts').update({
      status:c.status,ended_on:c.ended_on||null,damage:c.damage||0,
      lines:c.lines,refills:c.refills
    }).eq('id',c.id);
    else await this.save();
  },
  async insertPO(p){
    POS.unshift(p);
    if(LIVE){const r=await db.from('pos').insert([stripLocal(p)]).select().single();if(r.data)p.id=r.data.id}
    else await this.save();
  },
  async updatePO(p){
    if(LIVE)await db.from('pos').update({status:p.status,approval:p.approval,approved_by:p.approved_by||null,receipt_no:p.receipt_no||null}).eq('id',p.id);
    else await this.save();
  },
  async insertTransfer(t){
    TRANSFERS.unshift(t);
    if(LIVE){const r=await db.from('transfers').insert([stripLocal(t)]).select().single();if(r.data)t.id=r.data.id}
    else await this.save();
  },
  async saveSettings(){
    if(LIVE)await db.from('settings').upsert([
      {key:'vatRate',value:SETTINGS.vatRate},
      {key:'approvalThreshold',value:SETTINGS.approvalThreshold},
      {key:'min',value:SETTINGS.min||{}},
      {key:'counters',value:counters}
    ]);
    else await this.save();
  }
};
function stripLocal(o){const x=Object.assign({},o);delete x.id;return x}
function snapshot(){return{products:PRODUCTS,orders:ORDERS,contracts:CONTRACTS,customers:CUSTOMERS,pos:POS,transfers:TRANSFERS,fleet:FLEET,settings:SETTINGS,counters}}
function applySnapshot(d){
  PRODUCTS.length=0;ORDERS.length=0;CONTRACTS.length=0;CUSTOMERS.length=0;POS.length=0;TRANSFERS.length=0;FLEET.length=0;
  Object.keys(byId).forEach(k=>delete byId[k]);
  (d.products||[]).forEach(x=>{PRODUCTS.push(x);byId[x.id]=x});
  (d.orders||[]).forEach(x=>ORDERS.push(x));
  (d.contracts||[]).forEach(x=>CONTRACTS.push(x));
  (d.customers||[]).forEach(x=>CUSTOMERS.push(x));
  (d.pos||[]).forEach(x=>POS.push(x));
  (d.transfers||[]).forEach(x=>TRANSFERS.push(x));
  (d.fleet||[]).forEach(x=>FLEET.push(x));
  if(d.settings)SETTINGS=Object.assign(SETTINGS,d.settings);
  if(d.counters)counters=Object.assign(counters,d.counters);
}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
async function seedIfEmpty(){
  // In local mode: seed only if nothing saved
  if(!LIVE){
    if(localStorage.getItem(DB_KEY))return false;
  }else{
    const{count}=await db.from('products').select('id',{count:'exact',head:true});
    if(count&&count>0)return false;
  }
  const rnd=mulberry32(20261010);
  const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
  const pk=a=>a[Math.floor(rnd()*a.length)];

  // Products
  const items=[
    ['DEV','Nebula Mini Diffuser',[['White',7500],['Black',7500]]],
    ['DEV','Nebula Pro Diffuser',[['White',18000],['Black',18000]]],
    ['DEV','Mistral Wall 500',[['Standard',35000]]],
    ['DEV','Mistral Tower 800',[['Silver',48000]]],
    ['DEV','HVAC Duct 1000',[['Standard',90000]]],
    ['OIL','Oud Royale Fragrance Oil',[['100 ml',1200],['500 ml',5500],['1 L',10000]]],
    ['OIL','White Musk Fragrance Oil',[['100 ml',1200],['500 ml',5500]]],
    ['OIL','Amber Wood Fragrance Oil',[['100 ml',1300],['500 ml',5800]]],
    ['OIL','Jasmine Night Fragrance Oil',[['100 ml',1400],['500 ml',6200]]],
    ['BLK','Oud Royale Bulk Oil',[['per kg',7500]]],
    ['BLK','White Musk Bulk Oil',[['per kg',7000]]],
    ['BLK','Amber Wood Bulk Oil',[['per kg',7200]]],
    ['BLK','Jasmine Night Bulk Oil',[['per kg',7600]]],
    ['RDS','Reed Diffuser Set',[['100 ml',1400],['200 ml',2300]]],
    ['RDS','Room Spray',[['250 ml',650],['500 ml',1100]]],
    ['RDS','Scented Candle',[['Small',500],['Large',1200]]],
    ['PKG','Empty Glass Bottle',[['100 ml',110],['500 ml',210]]],
    ['PKG','Gift Box',[['Small',90],['Large',160]]],
    ['DAI','Fresh Milk',[['1 L',92],['2 L',178]]],
    ['DAI','Butter',[['100 g',110],['500 g',480]]],
    ['DAI','Set Yogurt',[['500 g',118],['1 kg',215]]],
    ['BEV','Drinking Water',[['1 L',28],['2 L',45]]],
    ['BEV','Cola',[['600 ml',45],['2 L',95]]],
    ['BEV','Orange Juice',[['1 L',125]]],
    ['HHD','Dishwash Liquid',[['250 ml',70],['750 ml',190]]],
    ['HHD','Laundry Powder',[['1 kg',170],['3 kg',480]]]
  ];
  let n=0;
  items.forEach(([cat,itemName,sizes])=>{
    sizes.forEach(([size,price])=>{
      const code=cat+'-'+pad(++n,4);
      const rl=cat==='DEV'?ri(2,8):cat==='BLK'?ri(4,14):ri(6,28);
      const stock={};
      BRANCHES.forEach(b=>{stock[b.id]=Math.round(rl*b.scale*(0.8+rnd()*5))});
      const scent=(cat==='OIL'||cat==='BLK')?itemName.split(' ').slice(0,2).join(' '):null;
      const p={id:'p'+n,sku:code,name:itemName+' '+size,cat,brand:'Sample',item:itemName,size,
        price,cost:Math.round(price*0.6),rl,stock,supplier:(SUPS.find(s=>s.cats.includes(cat))||SUPS[0]).id,
        scent,ml:cat==='OIL'?parseInt(size,10)||1000:null,unit:cat==='BLK'?'kg':null};
      p.hay=(p.name+' '+p.sku+' '+p.brand+' '+cat).toLowerCase();
      PRODUCTS.push(p);byId[p.id]=p;
    });
  });

  // Customers
  const custNames=[
    ['Lakeview Hotel, Gulshan','DHK'],['Blue Orchid Spa, Dhanmondi','DHK'],
    ['Nexus Office Tower, Motijheel','DHK'],['Sapphire Showroom, Banani','DHK'],
    ['Port City Hotel, Agrabad','CTG'],['Seaview Restaurant, Nasirabad','CTG'],
    ['Silk City Hotel','RAJ'],['Padma Salon, Shaheb Bazar','RAJ'],
    ['Rupsha Riverside Hotel','KHL'],['Sonadanga Showroom','KHL']
  ];
  custNames.forEach(([name,br],i)=>{
    CUSTOMERS.push({id:'C'+pad(1001+i,4),name,branch:br,
      type:/Hotel|Resort/.test(name)?'Hotel or resort':/Spa|Salon/.test(name)?'Spa or salon':/Office/.test(name)?'Office':/Restaurant/.test(name)?'Restaurant or cafe':'Retail or showroom',
      contact:'Sample Contact',phone:'01700-000'+pad(100+i,3),
      address:br,since:TODAY_ISO,limit_:100000,credit:0});
  });

  // Fleet ownership
  RITEMS.forEach(it=>{
    const own={};BRANCHES.forEach(b=>own[b.id]=Math.max(2,Math.round(10*b.scale)));
    FLEET.push({...it,own});
  });

  // Orders (14 days)
  let soNo=24180;
  for(let d=13;d>=0;d--){
    const date=iso(addDays(today,-d));
    const count=ri(3,7)-(d===0?2:0);
    for(let k=0;k<count;k++){
      const b=BRANCHES[Math.floor(rnd()*BRANCHES.length)];
      const lines=[];const used={};const nl=ri(2,4);
      while(lines.length<nl){
        const p=pk(PRODUCTS);
        if(used[p.id]||p.cat==='BLK')continue;
        used[p.id]=1;
        lines.push({pid:p.id,qty:ri(1,4),price:p.price});
      }
      const cust=pk(custNames.filter(c=>c[1]===b.id))[0];
      ORDERS.unshift({id:ORDERS.length+1,order_no:'SO-'+(++soNo),date,time:pad(ri(7,17),2)+':'+pad(ri(0,59),2),
        branch:b.id,customer:cust,lines,discount:0,status:d===0?'New':'Delivered',paid:rnd()<0.7});
    }
  }

  // Save everything
  if(LIVE){
    await db.from('products').insert(PRODUCTS.map(stripLocal));
    await db.from('customers').insert(CUSTOMERS.map(stripLocal));
    await db.from('fleet').insert(FLEET.map(stripLocal));

    await db.from('settings').upsert([
      {key:'vatRate',value:0},{key:'approvalThreshold',value:100000},
      {key:'min',value:{}},{key:'counters',value:{so:soNo,po:3040,tr:7010,rc:4100}}
    ]);
  }else{
    // Local mode: also seed contracts, purchases, transfers
    const rnd2=mulberry32(555);
    let rcNo=4100;
    for(let i=0;i<6;i++){
      const b=BRANCHES[i%BRANCHES.length];
      const it=pk(RITEMS);const months=12;const start=iso(addDays(today,-ri(10,120)));
      const end=cEnd(start,months);const sc=pk(SCENTS);
      const bk=PRODUCTS.find(p=>p.cat==='BLK'&&p.scent===sc);
      const qty=1;const ml=qty*it.oil_ml;
      const refills=[];for(let n2=1;n2<=months;n2++){const dd=addM(start,n2-1);if(dd>end)break;refills.push({n:n2,due:dd,status:n2<=3?'Delivered':'Scheduled',ml,deliveredOn:n2<=3?dd:null})}
      CONTRACTS.push({id:CONTRACTS.length+1,contract_no:'RC-'+(++rcNo),customer:pk(custNames.filter(c=>c[1]===b.id))[0],branch:b.id,
        start_date:start,months,every_:1,end_date:end,status:'Active',
        lines:[{rid:it.id,qty,fee:it.fee,lost:0}],
        oil:bk?{pid:bk.id,scent:sc,ml}:null,refills,deposit:it.deposit,damage:0});
    }
    for(let i=0;i<5;i++){
      const sup=pk(SUPS);const b=pk(BRANCHES);
      const pool=PRODUCTS.filter(p=>sup.cats.includes(p.cat));
      const lines=pool.slice(0,3).map(p=>({pid:p.id,qty:Math.max(12,p.rl*2),price:p.cost}));
      const received=i<3;
      POS.push({id:POS.length+1,po_no:'PO-'+(++counters.po),date:iso(addDays(today,-ri(5,20))),
        expected:iso(addDays(today,received?-3:ri(1,4))),supplier:sup.id,branch:b.id,lines,
        status:received?'Received':'Ordered',approval:'Approved',receipt_no:received?'GRN-'+(++counters.rc):null});
      if(received)lines.forEach(l=>{const p=byId[l.pid];if(p)p.stock[b.id]=(p.stock[b.id]||0)+l.qty});
    }
    for(let i=0;i<3;i++){
      const from=BRANCHES[0].id,to=BRANCHES[1].id;
      const lines=PRODUCTS.slice(i*2,i*2+2).map(p=>({pid:p.id,qty:2,price:p.price}));
      TRANSFERS.push({id:TRANSFERS.length+1,tr_no:'TR-'+(++counters.tr),date:iso(addDays(today,-ri(1,10))),
        from_branch:from,to_branch:to,lines,status:'Completed'});
    }
    await Store.save();
  }
  return true;
}

async function doSignIn(){
  const email=$('#l_email').value.trim();
  const password=$('#l_pass').value;
  if(!email||!password)return $('#l_err').textContent='Email and password required.';
  $('#l_err').textContent='Signing in…';
  const{data,error}=await db.auth.signInWithPassword({email,password});
  if(error)return $('#l_err').textContent=error.message;
  session={id:data.user.id,email:data.user.email,name:email.split('@')[0],role:'owner',branches:'all'};
  $('#login').hidden=true;
  bootApp();
}
async function doSignUp(){
  const email=$('#l_email').value.trim();
  const password=$('#l_pass').value;
  if(!email||!password)return $('#l_err').textContent='Email and password required.';
  if(password.length<6)return $('#l_err').textContent='Password must be at least 6 characters.';
  $('#l_err').textContent='Creating account…';
  const{data,error}=await db.auth.signUp({email,password});
  if(error)return $('#l_err').textContent=error.message;
  if(!data.session){
    return $('#l_err').textContent='Account created. Check your email to confirm, then sign in. (You can turn off email confirmation in Supabase → Authentication → Providers → Email.)';
  }
  session={id:data.user.id,email:data.user.email,name:email.split('@')[0],role:'owner',branches:'all'};
  $('#login').hidden=true;
  bootApp();
}
async function signOut(){
  if(LIVE)await db.auth.signOut();
  session=null;
  PRODUCTS.length=0;ORDERS.length=0;CONTRACTS.length=0;CUSTOMERS.length=0;
  POS.length=0;TRANSFERS.length=0;FLEET.length=0;Object.keys(byId).forEach(k=>delete byId[k]);
  closeModal();
  if(LIVE)renderLogin();else{clearCfg();location.reload()}
}

/* ═══════════════════════════════════════════════════════════════
   Boot
   ═══════════════════════════════════════════════════════════════ */
async function bootApp(){
  try{await seedIfEmpty()}catch(e){console.warn('seed',e)}
  try{await Store.load()}catch(e){console.warn('load',e);toast('Could not load data: '+e.message)}
  $('#login').hidden=true;$('#app').hidden=false;
  $('#modeTag').textContent=LIVE?'Live':'Local';
  $('#nav').innerHTML=Object.keys(TITLES).map(k=>`<button type="button" data-act="nav" data-view="${k}">${TITLES[k]}<span class="badge" id="bd-${k}" hidden></span></button>`).join('');
  $('#branchSel').innerHTML='<option value="all">All branches</option>'+BRANCHES.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('');
  renderWho();
  render(true);
  if(LIVE){
    db.channel('sr')
      .on('postgres_changes',{event:'*',schema:'public',table:'products'},()=>Store.load().then(()=>render()))
      .on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>Store.load().then(()=>render()))
      .on('postgres_changes',{event:'*',schema:'public',table:'contracts'},()=>Store.load().then(()=>render()))
      .subscribe();
  }
}
function renderWho(){
  if(!session)return;
  $('#who').innerHTML=`<div><b>${esc(session.name||session.email||'User')}</b><span class="sub">${esc(session.role)}</span></div>
    <button class="btn small" data-act="sign-out">Sign out</button>`;
}
const TITLES={overview:'Overview',inventory:'Inventory',orders:'Sales orders',customers:'Customers',

function updateBadges(){
  const set=(k,n)=>{const e=$('#bd-'+k);if(!e)return;e.hidden=!n;e.textContent=n};
  set('orders',ORDERS.filter(o=>inScope(o)&&o.status!=='Delivered').length);
  set('contracts',CONTRACTS.filter(c=>inScope(c)&&c.status!=='Ended').length);
  let due=0;CONTRACTS.forEach(c=>{if(inScope(c))(c.refills||[]).forEach(r=>{if(r.status==='Scheduled'&&r.due<=TODAY_ISO)due++})});set('refills',due);

function go(v){state.view=v;render(true)}
function render(top){

async function applyAdjust(pid){

function custStats(c){
  let n=0,total=0,due=0,last='';
  ORDERS.forEach(o=>{if(o.customer!==c.name)return;n++;total+=orderTotal(o);if(!o.paid)due+=orderTotal(o);if(o.date>last)last=o.date});

function openCustomer(id){
  const c=CUSTOMERS.find(x=>x.id===id);if(!c)return;
  const s=custStats(c);
  const hist=ORDERS.filter(o=>o.customer===c.name).slice(0,5);
  const hr=hist.length?hist.map(o=>`<tr data-act="ord-open" data-no="${o.order_no}"><td class="mono nw">${o.order_no}</td>
    <td class="nw">${dshort(o.date)}</td><td class="num">${money(orderTotal(o))}</td><td>${pill(o.status)}</td></tr>`).join('')
    :'<tr><td colspan="4" class="sub">No orders yet.</td></tr>';
  openModal(`<div class="sheet wide" role="dialog"><div class="sheet-h"><h2>${esc(c.name)}</h2><button class="x" data-act="close">×</button></div>
   <div class="sheet-b"><div class="meta"><div><span>ID</span><b class="mono">${c.id}</b></div><div><span>Type</span>${esc(c.type||'')}</div>
   <div><span>Phone</span><b class="mono">${esc(c.phone||'—')}</b></div><div><span>Branch</span>${esc(bname(c.branch))}</div></div>
   <div class="meta"><div><span>Orders</span><b>${s.n}</b></div><div><span>Total sales</span><b>${money(s.total)}</b></div>
   <div><span>Unpaid</span><b>${money(s.due)}</b></div></div>
   <h4>Recent orders</h4>${table('<th>Order</th><th>Date</th><th class="num">Value</th><th>Status</th>',hr)}</div>
   <div class="sheet-f"><span></span><div class="btns"><button class="btn" data-act="close">Close</button>
   ${s.due>0?`<button class="btn" data-act="cust-collect" data-id="${c.id}">Mark all paid</button>`:''}
   <button class="btn primary" data-act="cust-order" data-b="${c.branch}" data-name="${esc(c.name)}">New sale</button></div></div></div>`);
}
async function collectCustomer(id){
  const c=CUSTOMERS.find(x=>x.id===id);if(!c)return;
  let sum=0;
  for(const o of ORDERS.filter(o=>o.customer===c.name&&!o.paid)){o.paid=true;await Store.updateOrder(o);sum+=orderTotal(o)}
  openCustomer(id);render();toast(`${money(sum)} recorded.`);
}

  openModal(`<div class="sheet" role="dialog"><div class="sheet-h"><h2>New customer</h2><button class="x" data-act="close">×</button></div>

    <label class="f">Address<input id="c_addr" class="in"></label>
   </div><div id="c_err" class="msg"></div></div>

   <button class="btn primary" data-act="cust-save">Save</button></div></div></div>`);

async function saveCustomer(){
  const name=$('#c_name').value.trim();if(!name)return $('#c_err').textContent='Name required.';
  if(custByName(name))return $('#c_err').textContent='Already exists.';
  const c={id:'C'+pad(1001+CUSTOMERS.length,4),name,branch:$('#c_branch').value,
    type:$('#c_type').value,contact:$('#c_contact').value.trim(),phone:$('#c_phone').value.trim(),
    address:$('#c_addr').value.trim()||'—',since:TODAY_ISO,limit_:50000,credit:0};
  await Store.insertCustomer(c);
  closeModal();render();toast(`${name} added.`);
}

function openContract(no){
  const c=CONTRACTS.find(x=>x.contract_no===no);if(!c)return;
  const rows=(c.lines||[]).map(l=>{const it=RBY[l.rid]||{name:'—'};
    return `<tr><td>${esc(it.name)}</td><td class="num">${l.qty}</td><td class="num">${money(l.fee)}</td><td class="num">${money(l.qty*l.fee)}</td></tr>`}).join('');
  const rf=(c.refills||[]).map(r=>{const s=rfstat(r);
    return `<tr><td class="num">${r.n}</td><td class="nw">${dshort(r.due)}</td><td class="num">${num(r.ml)} ml</td><td>${pill(s)}</td>
    <td class="nw">${r.deliveredOn?dshort(r.deliveredOn):'—'}</td>
    <td class="num">${r.status==='Scheduled'&&r.due<=TODAY_ISO?`<button class="btn small" data-act="rf-deliver" data-no="${c.contract_no}" data-n="${r.n}" data-modal="1">Deliver</button>`:''}</td></tr>`}).join('');
  openModal(`<div class="sheet wide" role="dialog"><div class="sheet-h"><h2>${c.contract_no} ${pill(cstat(c))}</h2><button class="x" data-act="close">×</button></div>
   <div class="sheet-b"><div class="meta"><div><span>Customer</span>${esc(c.customer)}</div><div><span>Branch</span>${esc(bname(c.branch))}</div>
   <div><span>Term</span>${dshort(c.start_date)} → ${dshort(c.end_date)}</div><div><span>Deposit</span>${money(c.deposit)}</div>
   <div><span>Monthly</span>${money(cMonthly(c))}</div></div>
   <h4>Devices</h4>${table('<th>Model</th><th class="num">Units</th><th class="num">Fee</th><th class="num">Per month</th>',rows)}
   ${c.oil?`<h4>Oil refills</h4>${table('<th class="num">#</th><th>Due</th><th class="num">Oil</th><th>Status</th><th>Delivered</th><th></th>',rf)}`:''}</div>
   <div class="sheet-f"><span></span><div class="btns"><button class="btn" data-act="close">Close</button>
   ${c.status==='Reserved'?`<button class="btn primary" data-act="ct-start" data-no="${c.contract_no}" data-modal="1">Start</button>`:(c.status!=='Ended')?`<button class="btn primary" data-act="ct-end" data-no="${c.contract_no}">End</button>`:''}</div></div></div>`);

async function startContract(no,fromModal){
  const c=CONTRACTS.find(x=>x.contract_no===no);if(!c)return;
  c.status='Active';
  await Store.updateContract(c);
  if(fromModal)openContract(no);render();toast(`${no} started.`);
}
async function deliverRefill(no,n,fromModal){
  const c=CONTRACTS.find(x=>x.contract_no===no);if(!c||!c.oil)return;
  const r=(c.refills||[]).find(x=>x.n===n);if(!r||r.status!=='Scheduled')return;
  const p=byId[c.oil.pid];if(!p)return;
  const kg=+kgOf(r.ml,c.oil.scent).toFixed(3);
  const cur=(p.stock||{})[c.branch]||0;
  if(cur<kg)return toast(`Need ${kg} kg of ${c.oil.scent}, have ${cur} kg.`);
  p.stock=Object.assign({},p.stock,{[c.branch]:+(cur-kg).toFixed(3)});
  await Store.updateProduct(p);
  r.status='Delivered';r.deliveredOn=TODAY_ISO;
  await Store.updateContract(c);
  if(fromModal)openContract(no);render();toast(`Refill ${n} delivered.`);
}
let endr=null;
function openEnd(no){
  const c=CONTRACTS.find(x=>x.contract_no===no);if(!c)return;
  endr={no,miss:(c.lines||[]).map(()=>0)};
  const rows=(c.lines||[]).map((l,i)=>{const it=RBY[l.rid]||{name:'—',value:0};
    return `<tr><td>${esc(it.name)}</td><td class="num">${l.qty}</td>
    <td class="num"><input class="in qty" type="number" min="0" max="${l.qty}" value="0" data-bind="end_miss" data-i="${i}"></td>
    <td class="num">${money(it.value)}</td></tr>`}).join('');
  openModal(`<div class="sheet wide" role="dialog"><div class="sheet-h"><h2>End ${c.contract_no}</h2><button class="x" data-act="close">×</button></div>
   <div class="sheet-b"><p class="sub">Enter any devices damaged or missing.</p>
   ${table('<th>Model</th><th class="num">Out</th><th class="num">Missing</th><th class="num">Value</th>',rows)}
   <div style="text-align:right"><div class="sub">Damage/loss: <b id="bDmg">৳0</b></div>
   <div class="tot" id="bBal">৳0</div></div></div>
   <div class="sheet-f"><span></span><div class="btns"><button class="btn" data-act="close">Cancel</button>
   <button class="btn primary" data-act="ct-end-save">Complete</button></div></div></div>`);
  refreshEnd();
}
function refreshEnd(){
  const c=CONTRACTS.find(x=>x.contract_no===endr.no);if(!c)return;
  const dmg=(c.lines||[]).reduce((s,l,i)=>s+endr.miss[i]*((RBY[l.rid]||{value:0}).value),0);
  const bal=dmg-c.deposit;
  $('#bDmg').textContent=money(dmg);
  $('#bBal').textContent=(bal>=0?'Collect ':'Refund ')+money(Math.abs(bal));
}
async function completeEnd(){
  const c=CONTRACTS.find(x=>x.contract_no===endr.no);if(!c)return;
  const dmg=(c.lines||[]).reduce((s,l,i)=>s+endr.miss[i]*((RBY[l.rid]||{value:0}).value),0);
  c.status='Ended';c.ended_on=TODAY_ISO;c.damage=dmg;
  c.lines=(c.lines||[]).map((l,i)=>({...l,lost:endr.miss[i]}));
  c.refills=(c.refills||[]).map(r=>r.status==='Scheduled'?{...r,status:'Cancelled'}:r);
  await Store.updateContract(c);
  closeModal();render();toast(`${c.contract_no} ended.`);
}

function vRefills(){
  const R=state.rf;
  const all=[];CONTRACTS.forEach(c=>{if(inScope(c))(c.refills||[]).forEach(r=>all.push({c,r}))});
  const cnt=s=>all.filter(x=>matchRf(x,s)).length;
  $('#view').innerHTML=`<div style="display:flex;flex-direction:column;gap:12px">
  <div class="toolbar"><input id="rfQ" class="in grow" placeholder="Search refills" value="${esc(R.q)}" data-bind="rfQ"></div>
  <div class="chips">${['Pending','Overdue','Due today','Delivered','All'].map(s=>`<button class="chip" data-act="rf-st" data-st="${s}" aria-pressed="${R.st===s}">${s}<b>${cnt(s)}</b></button>`).join('')}</div>
  <div id="rfOut"></div></div>`;
  updateRf();
}
function matchRf(x,s){const st=rfstat(x.r);if(s==='All')return true;if(s==='Pending')return x.r.status==='Scheduled';return st===s}
function updateRf(){
  const R=state.rf,q=R.q.trim().toLowerCase();
  const rows=[];CONTRACTS.forEach(c=>{if(inScope(c))(c.refills||[]).forEach(r=>rows.push({c,r}))});
  const list=rows.filter(x=>matchRf(x,R.st)&&(!q||((x.c.contract_no||'')+' '+(x.c.customer||'')).toLowerCase().includes(q))).slice(0,60);
  const body=list.map(x=>{const c=x.c,r=x.r,s=rfstat(r);
    return `<tr data-act="ct-open" data-no="${c.contract_no}"><td class="nw">${dshort(r.due)}</td>
    <td class="mono nw">${c.contract_no}</td><td>${esc(c.customer)}</td><td class="nw">${esc(bname(c.branch))}</td>
    <td>${c.oil?esc(c.oil.scent):'—'}</td><td class="num">${num(r.ml)} ml</td><td>${pill(s)}</td>
    <td class="num">${r.status==='Scheduled'&&r.due<=TODAY_ISO?`<button class="btn small" data-act="rf-deliver" data-no="${c.contract_no}" data-n="${r.n}">Deliver</button>`:''}</td></tr>`}).join('');
  $('#rfOut').innerHTML=list.length?table('<th>Due</th><th>Contract</th><th>Customer</th><th>Branch</th><th>Oil</th><th class="num">Amount</th><th>Status</th><th></th>',body):'<div class="tablewrap"><p class="empty">No refills.</p></div>';
}

function vFleet(){
  const R=state.fl;const sb=scopeBranches(),all=sb.length>1;
  const list=FLEET.length?FLEET:RITEMS.map(r=>({...r,own:{}}));
  const rows=list.filter(it=>(R.cat==='all'||it.cat===R.cat)&&(!R.q||((it.name||'')+' '+(it.code||'')).toLowerCase().includes(R.q.toLowerCase()))).map(it=>{
    let own=0,out=0;
    const cells=sb.map(b=>{const o=(it.own||{})[b.id]||0,u=fOutNow(it,b.id);own+=o;out+=u;
      return `<td class="num ${o-u===0?'c-out':(o-u)<=o*0.2?'c-low':''}">${o-u} / ${o}</td>`}).join('');
    const free=own-out;const st=free===0?['None','crit']:free<=own*0.2?['Low','warn']:['Available','good'];
    return `<tr data-act="fl-open" data-id="${it.id}"><td class="mono nw">${it.code}</td><td><div class="pn">${esc(it.name)}</div></td>
      <td class="nw">${esc(it.cat)}</td>${cells}${all?`<td class="num">${free} / ${own}</td>`:''}
      <td>${pill(st[0],st[1])}</td><td class="num">${money(it.fee)}</td><td class="num">${money(it.deposit)}</td></tr>`}).join('');
  const head=`<th>Code</th><th>Model</th><th>Type</th>${sb.map(b=>`<th class="num">${all?b.id:'Free/Owned'}</th>`).join('')}${all?'<th class="num">Total</th>':''}<th>Status</th><th class="num">Fee</th><th class="num">Deposit</th>`;
  $('#view').innerHTML=`<div style="display:flex;flex-direction:column;gap:12px">
  <div class="toolbar"><input id="flQ" class="in grow" placeholder="Search fleet" value="${esc(R.q)}" data-bind="flQ">
  <select id="flCat"><option value="all">All types</option>${RCATS.map(c=>`<option${R.cat===c?' selected':''}>${esc(c)}</option>`).join('')}</select>
  <button class="btn primary" data-act="new-contract">New contract</button></div>
  ${rows?table(head,rows):'<div class="tablewrap"><p class="empty">No models.</p></div>'}</div>`;
}

function renderContractLines(){
  const d=kd,host=$('#kLines');
  if(!d.lines.length){host.innerHTML='<div class="tablewrap"><p class="empty">No devices yet.</p></div>';refreshContract();return}
  const rows=d.lines.map((l,i)=>{const it=RBY[l.rid];
    return `<tr data-i="${i}"><td>${esc(it.name)}</td>
    <td class="num"><input class="in qty" type="number" min="1" value="${l.qty}" data-bind="k_qty" data-i="${i}"></td>
    <td class="num"><input class="in qty price" type="number" min="0" step="100" value="${l.fee}" data-bind="k_fee" data-i="${i}"></td>
    <td class="num nw" data-amt="${i}"></td>
    <td class="num"><button class="btn ghost small" data-act="k-rm" data-i="${i}">Remove</button></td></tr>`}).join('');
  host.innerHTML=table('<th>Model</th><th class="num">Units</th><th class="num">Fee</th><th class="num">Per month</th><th></th>',rows);
  refreshContract();
}
function refreshContract(){
  const d=kd;let bad=false,monthly=0;
  d.lines.forEach((l,i)=>{const it=RBY[l.rid],row=$(`#kLines tr[data-i="${i}"]`);
    const err=!(l.qty>0);
    if(row){row.classList.toggle('err',err);const a=row.querySelector('[data-amt]');if(a)a.textContent=money(l.qty*l.fee)}
    if(err)bad=true;monthly+=Math.max(0,l.qty)*l.fee});
  $('#kSum').textContent=money(monthly)+' per month';
  $('#kSave').disabled=bad||!d.lines.length||!d.party.trim();
}
function suggestFleet(v){
  const box=$('#k_sugg'),q=v.trim().toLowerCase();if(!q){box.hidden=true;return}
  const list=(FLEET.length?FLEET:RITEMS);
  const res=list.filter(it=>((it.name||'')+' '+(it.code||'')+' '+it.cat).toLowerCase().includes(q));
  box.innerHTML=res.length?res.map(it=>`<button type="button" class="sg" data-act="k-add" data-id="${it.id}"><span><b>${esc(it.name)}</b></span>
    <span class="sub">${money(it.fee)}/mo</span></button>`).join(''):'<div class="sg none">No matches.</div>';
  box.hidden=false;
}
async function saveContract(){
  const d=kd;
  let cu=custByName(d.party.trim());
  if(!cu){
    const c={id:'C'+pad(1001+CUSTOMERS.length,4),name:d.party.trim(),branch:d.branch,type:'Retail or showroom',
      contact:'',phone:'',address:'—',since:TODAY_ISO,limit_:50000,credit:0};
    await Store.insertCustomer(c);cu=c;
  }
  const ml=d.lines.reduce((s,l)=>s+l.qty*RBY[l.rid].oil_ml,0)*d.every;
  const end=cEnd(d.start,d.term);const inc=d.oil==='inc';
  const refills=[];
  if(inc){for(let n=1;;n++){const dd=addM(d.start,(n-1)*d.every);if(dd>end)break;refills.push({n,due:dd,status:'Scheduled',ml,deliveredOn:null})}}
  const row={
    contract_no:'RC-'+(++counters.rc),customer:d.party.trim(),branch:d.branch,
    start_date:d.start,months:d.term,every_:d.every,end_date:end,
    status:d.start<=TODAY_ISO?'Active':'Reserved',
    lines:d.lines.map(l=>({rid:l.rid,qty:l.qty,fee:l.fee,lost:0})),
    oil:inc&&bulkProd(d.scent)?{pid:bulkProd(d.scent).id,scent:d.scent,ml}:null,
    refills,deposit:d.lines.reduce((s,l)=>s+l.qty*RBY[l.rid].deposit,0),damage:0
  };
  await Store.insertContract(row);
  await Store.saveSettings();
  closeModal();state.ct.st='All';go('contracts');toast(`${row.contract_no} created.`);
}

function openPO(no){
  const p=POS.find(x=>x.po_no===no);if(!p)return;
  openModal(`<div class="sheet wide" role="dialog"><div class="sheet-h"><h2>${p.po_no} ${pill(p.status)}</h2><button class="x" data-act="close">×</button></div>
   <div class="sheet-b"><div class="meta"><div><span>Supplier</span>${esc((SUPBY[p.supplier]||{name:p.supplier}).name)}</div>
   <div><span>Branch</span>${esc(bname(p.branch))}</div><div><span>Date</span>${dshort(p.date)}</div>
   <div><span>Expected</span>${dshort(p.expected)}</div></div>
   ${table('<th>Product</th><th class="num">Qty</th><th class="num">Cost</th><th class="num">Amount</th>',
     (p.lines||[]).map(l=>{const pr=byId[l.pid]||{name:'—'};
     return `<tr><td>${esc(pr.name)}</td><td class="num">${l.qty}</td><td class="num">${money(l.price)}</td><td class="num">${money(l.qty*l.price)}</td></tr>`}).join(''))}</div>
   <div class="sheet-f"><div class="tot">${money(orderSub(p))}</div><div class="btns"><button class="btn" data-act="close">Close</button>
   ${p.status==='Ordered'?`<button class="btn primary" data-act="po-recv" data-no="${p.po_no}">Receive</button>`:''}</div></div></div>`);
}
async function receivePO(no){
  const p=POS.find(x=>x.po_no===no);if(!p||p.status!=='Ordered')return;
  for(const l of (p.lines||[])){
    const pr=byId[l.pid];if(!pr)continue;
    const cur=(pr.stock||{})[p.branch]||0;
    pr.stock=Object.assign({},pr.stock,{[p.branch]:cur+l.qty});
    await Store.updateProduct(pr);
  }
  p.status='Received';p.receipt_no='GRN-'+(++counters.rc);
  await Store.updatePO(p);
  await Store.saveSettings();
  closeModal();render();toast('Stock received.');
}

let draft=null;
const DOCT={order:'New sale',po:'New purchase order',transfer:'New stock transfer'};
function openDoc(type,preset){
  preset=preset||{};
  const b0=preset.branch||(state.branch==='all'?'DHK':state.branch);
  draft={type,branch:b0,to:BRANCHES.find(b=>b.id!==b0).id,party:preset.party||'',
    supplier:preset.supplier||'S1',date:iso(addDays(today,3)),discount:0,lines:[]};
  if(preset.lines)draft.lines=preset.lines.map(l=>({...l}));
  renderDoc();
}
function renderDoc(){
  const d=draft,t=d.type;
  const brOpts=sel=>BRANCHES.map(b=>`<option value="${b.id}"${b.id===sel?' selected':''}>${esc(b.name)}</option>`).join('');
  let f='';
  if(t==='order')f=`<label class="f">Branch<select id="d_branch" data-bind="d_branch">${brOpts(d.branch)}</select></label>
    <label class="f">Customer<input id="d_party" class="in" value="${esc(d.party)}" data-bind="d_party" list="d_custs"><datalist id="d_custs">${CUSTOMERS.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist></label>
    <label class="f">Discount (৳)<input id="d_disc" class="in" type="number" value="${d.discount}" data-bind="d_disc"></label>`;
  else if(t==='po')f=`<label class="f">Supplier<select id="d_sup" data-bind="d_sup">${SUPS.map(s=>`<option value="${s.id}"${s.id===d.supplier?' selected':''}>${esc(s.name)}</option>`).join('')}</select></label>
    <label class="f">Deliver to<select id="d_branch" data-bind="d_branch">${brOpts(d.branch)}</select></label>
    <label class="f">Expected<input id="d_exp" class="in" type="date" value="${d.date}" data-bind="d_exp"></label>`;
  else f=`<label class="f">From<select id="d_branch" data-bind="d_branch">${brOpts(d.branch)}</select></label>
    <label class="f">To<select id="d_to" data-bind="d_to">${BRANCHES.filter(b=>b.id!==d.branch).map(b=>`<option value="${b.id}"${b.id===d.to?' selected':''}>${esc(b.name)}</option>`).join('')}</select></label>`;
  openModal(`<div class="sheet wide" role="dialog"><div class="sheet-h"><h2>${DOCT[t]}</h2><button class="x" data-act="close">×</button></div>
   <div class="sheet-b"><div class="fgrid">${f}</div>
    <div class="addrow"><input id="d_search" class="in" placeholder="Add a product" data-bind="d_search" autocomplete="off"><div id="d_sugg" class="sugg" hidden></div></div>
    <div id="docLines"></div></div>
   <div class="sheet-f"><div><div id="docMsg" class="msg"></div><div id="docSum" class="tot"></div></div>
   <div class="btns"><button class="btn" data-act="close">Cancel</button>
   <button id="docSave" class="btn primary" data-act="doc-save">${t==='order'?'Create sale':t==='po'?'Place order':'Transfer'}</button></div></div></div>`);
  renderLines();
}
function renderLines(){
  const d=draft,t=d.type;const host=$('#docLines');
  if(!d.lines.length){host.innerHTML='<div class="tablewrap"><p class="empty">No products yet.</p></div>';refreshDoc();return}
  const priced=t!=='transfer';
  const head=`<th>Product</th><th class="num">Stock</th><th class="num">Qty</th>${priced?`<th class="num">${t==='po'?'Cost':'Price'}</th><th class="num">Amount</th>`:''}<th></th>`;
  const rows=d.lines.map((l,i)=>{const p=byId[l.pid];
    return `<tr data-i="${i}"><td><div class="pn">${esc(p.name)}</div></td>
      <td class="num">${num((p.stock||{})[d.branch]||0)}</td>
      <td class="num"><input class="in qty" type="number" min="1" value="${l.qty}" data-bind="d_qty" data-i="${i}"></td>
      ${priced?`<td class="num"><input class="in qty price" type="number" min="0" value="${l.price}" data-bind="d_price" data-i="${i}"></td>
      <td class="num nw" data-amt="${i}"></td>`:''}
      <td class="num"><button class="btn ghost small" data-act="doc-rm" data-i="${i}">Remove</button></td></tr>`}).join('');
  host.innerHTML=table(head,rows);refreshDoc();
}
function refreshDoc(){
  const d=draft,t=d.type;let total=0,bad=false,over=false;
  d.lines.forEach((l,i)=>{const p=byId[l.pid];const row=$(`#docLines tr[data-i="${i}"]`);
    const err=!(l.qty>0)||(t!=='po'&&l.qty>((p.stock||{})[d.branch]||0));
    if(t!=='po'&&l.qty>((p.stock||{})[d.branch]||0))over=true;
    if(row){row.classList.toggle('err',err);const a=row.querySelector('[data-amt]');if(a)a.textContent=money(l.qty*l.price)}
    if(err)bad=true;total+=Math.max(0,l.qty)*(l.price||0)});
  if(t==='order')total=Math.max(0,total-(+d.discount||0));
  $('#docSum').textContent=money(total);
  $('#docMsg').textContent=over?'Not enough stock.':'';
  const miss=!d.lines.length||(t==='order'&&!d.party.trim())||(t==='transfer'&&d.branch===d.to);
  $('#docSave').disabled=bad||miss;
}
function suggest(v){
  const box=$('#d_sugg');const q=v.trim().toLowerCase();if(!q){box.hidden=true;return}
  const words=q.split(/\s+/);const sup=draft.type==='po'?SUPBY[draft.supplier]:null;
  const res=PRODUCTS.filter(p=>(!sup||sup.cats.includes(p.cat))&&words.every(w=>(p.hay||'').includes(w))).slice(0,8);
  box.innerHTML=res.length?res.map(p=>`<button type="button" class="sg" data-act="doc-add" data-pid="${p.id}">
    <span><b>${esc(p.name)}</b></span><span class="sub">${num((p.stock||{})[draft.branch]||0)} · ${money(draft.type==='po'?p.cost:p.price)}</span></button>`).join('')
    :'<div class="sg none">No matches.</div>';
  box.hidden=false;
}
async function saveDoc(){
  const d=draft,t=d.type;
  if(t==='order'){
    let cu=custByName(d.party.trim());
    if(!cu){await Store.insertCustomer({id:'C'+pad(1001+CUSTOMERS.length,4),name:d.party.trim(),branch:d.branch,
      type:'Retail or showroom',contact:'',phone:'',address:'—',since:TODAY_ISO,limit_:50000,credit:0})}
    const o={order_no:'SO-'+(++counters.so),date:TODAY_ISO,time:nowT(),branch:d.branch,customer:d.party.trim(),
      lines:d.lines.map(l=>({...l})),discount:+d.discount||0,status:'New',paid:false};
    // Deduct stock
    for(const l of o.lines){
      const p=byId[l.pid];
      p.stock=Object.assign({},p.stock,{[d.branch]:((p.stock||{})[d.branch]||0)-l.qty});
      await Store.updateProduct(p);
    }
    await Store.insertOrder(o);
    await Store.saveSettings();
    closeModal();go('orders');toast(`${o.order_no} created.`);
  }else if(t==='po'){
    const p={po_no:'PO-'+(++counters.po),date:TODAY_ISO,expected:d.date,supplier:d.supplier,branch:d.branch,
      lines:d.lines.map(l=>({...l})),status:'Ordered',approval:'Approved'};
    await Store.insertPO(p);
    await Store.saveSettings();
    closeModal();go('purchases');toast(`${p.po_no} created.`);
  }else{
    const tr={tr_no:'TR-'+(++counters.tr),date:TODAY_ISO,from_branch:d.branch,to_branch:d.to,
      lines:d.lines.map(l=>({...l})),status:'Completed'};
    for(const l of tr.lines){
      const p=byId[l.pid];
      p.stock=Object.assign({},p.stock,{[tr.from_branch]:((p.stock||{})[tr.from_branch]||0)-l.qty,[tr.to_branch]:((p.stock||{})[tr.to_branch]||0)+l.qty});
      await Store.updateProduct(p);
    }
    await Store.insertTransfer(tr);
    await Store.saveSettings();
    closeModal();go('transfers');toast(`${tr.tr_no} done.`);
  }
}
